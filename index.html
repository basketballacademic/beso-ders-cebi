weeks:[
{h:1,b:"Sporun bilimsel temelleri",k:[0,[4,0,3]],m:[
"Spor bilimleri disiplinlerarası bir alandır: fizyoloji, biyomekanik, psikoloji, sosyoloji, pedagoji, yönetim ve sağlık bilimleri sporu farklı açılardan inceler."],
p:[0,4],sc:[0]},
{h:2,b:"Spor bilimlerinin felsefi temelleri",k:[5],p:[5],sc:[5]},
{h:3,b:"Spor bilimlerinin tarihsel temelleri",k:[[2,1,4],[3,0,1]],m:[
"İlk çağ uygarlıklarında (Mısır, Mezopotamya, Çin, Orta Asya Türkleri) bedensel etkinlikler; avcılık, savaş hazırlığı, dinî törenler ve eğlence ile iç içedir.",
"Orta Asya Türklerinde binicilik, okçuluk, güreş ve cirit hem askerî eğitimin hem de toplumsal yaşamın parçasıdır."],p:[2],sc:[2]},
{h:4,b:"Spor pedagojisi",k:[1,10],m:[
"Spor pedagojisi; spor ve hareket yoluyla eğitimi, öğretme-öğrenme süreçlerini ve sporun eğitsel değerlerini inceleyen alt disiplindir."],p:[1,10],sc:[1,10]},
{h:5,b:"Spor sosyolojisi",k:[8],m:[
"Spor sosyolojisi sporu toplumsal bir kurum olarak inceler; spora sosyalleşme, spor yoluyla sosyalleşme, medya, ekonomi ve kimlik ilişkileri başlıca konularıdır."],p:[8],sc:[8]},
{h:6,b:"Spor psikolojisi",m:[
"Spor psikolojisi; spor ve egzersiz ortamındaki davranışları, düşünceleri ve duyguları inceleyen ve performansı, iyi oluşu ve katılımı artırmayı amaçlayan alandır.",
"Motivasyon: İçsel motivasyon etkinliğin kendisinden alınan hazdan, dışsal motivasyon ödül, not veya övgü gibi dış kaynaklardan gelir; uzun süreli katılım için içsel motivasyon daha belirleyicidir.",
"Kaygı ve uyarılma: Ters U hipotezine göre performans orta düzey uyarılmada en yüksektir; çok düşük ve çok yüksek uyarılma performansı düşürür.",
"Öz yeterlik (Bandura): Kişinin bir görevi başarabileceğine olan inancıdır; başarılı deneyimler, model alma, sözel ikna ve fizyolojik durum öz yeterliği etkiler.",
"Dikkat, hedef belirleme, imgeleme (zihinsel canlandırma) ve öz konuşma, sporcuların kullandığı temel psikolojik becerilerdir.",
"Beden eğitimi derslerinde başarı duygusu, seçim hakkı ve aidiyet, öğrencilerin içsel motivasyonunu artırır."],
np:[{t:"Zihnin oyunu",d:"Spor psikolojisine giriş",s:[
["H","Bugün sporun görünmeyen tarafını konuşacağız: zihni. Bir maçın son saniyesinde serbest atış kullanan oyuncunun elleri neden titrer?"],
["Ö","Heyecandan hocam. Kaygı yükseliyor."],
["H","Doğru. Ters U hipotezine göre performans orta düzey uyarılmada en yüksektir. Çok rahat olan da, aşırı gergin olan da düşük performans gösterir."],
["Ö","Peki sporcular bunu nasıl kontrol ediyor?"],
["H","Nefes çalışmaları, imgeleme, yani hareketi zihinde canlandırma, ve öz konuşma. Kendine “sakin, dirseğini hizala” demek bile dikkati doğru yere yönlendirir."],
["Ö","Motivasyon da spor psikolojisinin konusu, değil mi?"],
["H","Evet. İçsel motivasyon etkinliğin kendisinden zevk almaktır, dışsal motivasyon ödül ya da not için yapmaktır. Bir öğrencinin yaşam boyu aktif kalmasını istiyorsak içsel motivasyonu beslemeliyiz: başarı duygusu, seçim hakkı ve aidiyet."],
["Ö","Öz yeterlik de Bandura'nın kavramıydı."],
["H","Evet, “bunu yapabilirim” inancı. En güçlü kaynağı başarılı deneyimlerdir. Bu yüzden görevleri öğrencinin başarabileceği basamaklara bölmek, psikolojik olarak da en doğru öğretmenlik yaklaşımıdır."]]}],
nsc:[["İçsel ve dışsal motivasyonu beden eğitimi dersinden örnekle açıklar mısınız?","İçsel motivasyon: Öğrencinin basketbol oynamayı sırf eğlenceli olduğu ve kendini geliştirdiğini hissettiği için istemesi. Dışsal motivasyon: Not almak, ödül kazanmak ya da öğretmenden övgü almak için katılması. Dışsal ödüller kısa vadede işe yarar; ancak uzun vadeli katılım için öğrencinin başarı, seçim ve aidiyet duygusuyla beslenen içsel motivasyonu daha belirleyicidir."]]},
{h:7,b:"Spor bilimlerinde kariyer alanları ve meslek seçimi",k:[7],m:[
"Spor bilimleri fakültelerinde başlıca bölümler: beden eğitimi ve spor öğretmenliği, antrenörlük eğitimi, spor yöneticiliği, rekreasyon ve egzersiz ve spor bilimleri.",
"Kariyer alanları: okullarda beden eğitimi öğretmenliği, kulüp ve federasyonlarda antrenörlük, kondisyonerlik, spor yöneticiliği ve organizasyon, rekreasyon liderliği, sporcu performans analizi, spor medyası, akademisyenlik.",
"Meslek seçiminde kişisel ilgi ve yetenekler, değerler, çalışma koşulları ve iş olanakları birlikte değerlendirilmelidir; staj, gönüllülük ve kurs deneyimleri karar vermeyi kolaylaştırır.",
"Beden eğitimi öğretmenleri ayrıca okul takımlarının çalıştırıcılığı, sportif etkinliklerin düzenlenmesi ve okul sağlığı çalışmalarında görev alır."],p:[7],sc:[7],
nsc:[["Spor bilimleri mezunu olarak öğretmenlik dışında hangi alanlarda çalışabilirim?","Antrenörlük ve kondisyonerlik, spor kulübü ve federasyon yöneticiliği, spor organizasyonları, rekreasyon ve turizm (otel animasyonu, açık hava etkinlikleri), fitness ve egzersiz danışmanlığı, performans analizi, spor medyası ve akademik kariyer başlıca alanlardır. Bazı alanlar ek belge (antrenörlük belgesi gibi) gerektirir."]]},
{h:9,b:"Spor-sağlık ilişkisi",k:[6,[11,4,5]],p:[6],sc:[6]},
{h:10,b:"Spor ve etik",k:[[11,0,4]],m:[
"Etik, doğru ve yanlış davranışı inceleyen felsefe dalıdır; spor etiği adalet, dürüstlük, saygı ve sorumluluk ilkelerini spor ortamına uygular.",
"Fair play yalnızca kurallara uymak değil; rakibe, hakeme ve oyunun ruhuna saygı göstermektir.",
"Etik sorunlar: doping, şike ve yasa dışı bahis, centilmenlik dışı davranışlar, ayrımcılık, çocuk sporcuların aşırı yüklenmesi.",
"Beden eğitimi öğretmeni etik değerleri hem kurallar ve yaptırımlarla hem de kendi davranışlarıyla model olarak öğretir."],p:[11],sc:[11]},
{h:11,b:"Antik Olimpiyat Oyunları",m:[
"Antik Olimpiyat Oyunları geleneksel olarak MÖ 776'da Yunanistan'ın Olympia kentinde, Zeus onuruna başlamış ve dört yılda bir düzenlenmiştir.",
"İki oyun arasındaki dört yıllık döneme olimpiyat denir; oyunlar sırasında kentler arasında kutsal ateşkes (ekeheiria) ilan edilirdi.",
"İlk oyunlarda tek yarış, yaklaşık 192 metrelik stadion koşusuydu; zamanla güreş, boks, pankration, at ve araba yarışları ile beşli yarışma (pentatlon: koşu, uzun atlama, disk, cirit, güreş) eklenmiştir.",
"Yarışmalara yalnızca özgür Yunan erkekleri katılabiliyordu; kazananlar zeytin dalından taç ile ödüllendirilirdi.",
"Oyunlar, Roma İmparatoru I. Theodosius döneminde MS 393 yılında yasaklanmıştır."],
np:[{t:"Zeytin dalından taç",d:"Antik Olimpiyat Oyunları",s:[
["H","Antik Olimpiyat Oyunları'na bir zaman yolculuğu yapalım. Hangi kentteyiz?"],
["Ö","Olympia'da hocam, Zeus onuruna düzenlenen oyunlardayız."],
["H","Evet. Geleneksel başlangıç tarihi milattan önce 776. Oyunlar dört yılda bir yapılırdı ve bu dört yıllık döneme olimpiyat denirdi. Oyunlar sırasında kentler arasında kutsal ateşkes ilan edilirdi."],
["Ö","İlk yarış neydi?"],
["H","Stadion koşusu, yaklaşık 192 metre. Zamanla güreş, boks, pankration, at yarışları ve pentatlon eklendi. Pentatlon; koşu, uzun atlama, disk, cirit ve güreşten oluşuyordu."],
["Ö","Kadınlar katılabiliyor muydu?"],
["H","Hayır, yarışmalara yalnızca özgür Yunan erkekleri katılabilirdi. Kazananlar zeytin dalından bir taçla ödüllendirilirdi; ama kentlerine döndüklerinde büyük onur ve ayrıcalıklar kazanırlardı."],
["Ö","Oyunlar nasıl sona erdi?"],
["H","Roma İmparatoru Birinci Theodosius döneminde, milattan sonra 393'te yasaklandı. Yaklaşık bin iki yüz yıl süren bu gelenek, on dokuzuncu yüzyılın sonunda modern olimpiyatlarla yeniden canlandı."]]}],
nsc:[["Antik ve modern olimpiyatlar arasındaki temel farklar nelerdir?","Antik oyunlar dinî bir festivaldi, yalnızca Olympia'da yapılır ve yalnızca özgür Yunan erkeklerine açıktı; ödül zeytin dalından taçtı. Modern oyunlar 1896'dan beri farklı ülkelerde düzenlenir, kadınlar ve tüm uluslar katılır, çok sayıda spor dalı vardır ve Olimpiyat Şartı'na dayalı uluslararası bir örgütlenmeye (IOC) sahiptir."]]},
{h:12,b:"Modern Olimpiyat Oyunları",k:[9,[4,3,5]],m:[
"Modern Olimpiyat Oyunları Pierre de Coubertin'in öncülüğünde 1894'te kurulan IOC ile başlatılmış, ilk oyunlar 1896'da Atina'da yapılmıştır.",
"Kadın sporcular ilk kez 1900 Paris Olimpiyatları'nda yarışmıştır; Kış Olimpiyat Oyunları 1924'te Chamonix'te başlamıştır."],p:[9],sc:[4,9]},
{h:13,b:"Türkiye'nin Olimpiyat Oyunları tarihi",m:[
"Türkiye Millî Olimpiyat Cemiyeti 1908'de kurulmuştur; Osmanlı Devleti adına 1912 Stockholm Olimpiyatları'na bir sporcu katılmıştır.",
"Türkiye Cumhuriyeti olimpiyatlara ilk kez 1924 Paris Olimpiyatları'nda katılmıştır.",
"Türkiye'nin ilk olimpiyat altın madalyası 1936 Berlin'de Yaşar Erkan'ın grekoromen güreşte kazandığı madalyadır; aynı oyunlarda eskrimci Halet Çambel olimpiyatlarda yarışan ilk Türk kadın sporcu olmuştur.",
"1948 Londra Olimpiyatları'nda Türk güreşçiler altı altın madalya kazanmıştır; güreş ve halter Türkiye'nin en çok madalya kazandığı branşlardır.",
"Naim Süleymanoğlu (1988, 1992, 1996) ve Halil Mutlu (1996, 2000, 2004) halterde üçer olimpiyat şampiyonluğu kazanmıştır; Nurcan Taylan 2004 Atina'da olimpiyat şampiyonu olan ilk Türk kadın sporcudur.",
"İstanbul, Yaz Olimpiyat Oyunları'na ev sahipliği için birçok kez aday olmuştur."],
np:[{t:"Berlin'den Atina'ya",d:"Türkiye'nin olimpiyat yolculuğu",s:[
["H","Türkiye'nin olimpiyat yolculuğu ne zaman başladı?"],
["Ö","Millî Olimpiyat Cemiyeti 1908'de kuruldu hocam."],
["H","Doğru. Osmanlı Devleti adına 1912 Stockholm'e bir sporcu katıldı. Cumhuriyet olarak ise ilk kez 1924 Paris Olimpiyatları'nda yer aldık."],
["Ö","İlk altın madalya ne zaman geldi?"],
["H","1936 Berlin'de, Yaşar Erkan grekoromen güreşte olimpiyat şampiyonu oldu. Aynı oyunlarda Halet Çambel eskrimde yarışarak olimpiyatlara katılan ilk Türk kadın sporcu oldu. Kendisi sonradan ünlü bir arkeolog olacaktı."],
["Ö","1948 Londra da önemliydi."],
["H","Evet, güreşçilerimiz altı altın madalya kazandı. Güreş ve halter en başarılı branşlarımız. Naim Süleymanoğlu ve Halil Mutlu halterde üçer kez olimpiyat şampiyonu oldu. 2004 Atina'da Nurcan Taylan olimpiyat şampiyonu olan ilk Türk kadın sporcu oldu."],
["Ö","Bu tarihin öğretmen adayı olarak bize anlamı ne?"],
["H","Bu başarıların çoğu okul ve kulüplerde keşfedilen yeteneklerle başladı. Ama asıl hedefimiz her çocuğun spora katılımı. Geniş bir taban olmadan zirve olmaz."]]}],
nsc:[["Türkiye'nin olimpiyat tarihindeki “ilk”leri nasıl hatırlayabilirim?","1908: Millî Olimpiyat Cemiyeti. 1912: Stockholm'e ilk katılım (Osmanlı). 1924: Cumhuriyet'in ilk katılımı (Paris). 1936: İlk altın madalya (Yaşar Erkan, güreş) ve ilk kadın sporcu (Halet Çambel, eskrim). 2004: İlk kadın olimpiyat şampiyonu (Nurcan Taylan, halter)."]]},
{h:14,b:"Türkiye'de erken Cumhuriyet dönemi spor politikaları",k:[[3,1,4]],m:[
"1922'de kurulan Türkiye İdman Cemiyetleri İttifakı (TİCİ) spor kulüplerini ve federasyonları tek çatı altında toplayan ilk ulusal spor örgütüdür.",
"Erken Cumhuriyet döneminde beden terbiyesi, sağlıklı ve güçlü bir nesil yetiştirme ve ulus inşası hedefleriyle ilişkilendirilmiştir (Akın, Gürbüz ve Yavuz Evlatlar).",
"1932'de kurulan Halkevleri, spor şubeleri aracılığıyla sporu halka yaymada önemli rol oynamıştır.",
"1938'de çıkarılan 3530 sayılı Beden Terbiyesi Kanunu ile Beden Terbiyesi Genel Direktörlüğü kurulmuş ve spor devletin düzenleyici rolüyle örgütlenmiştir.",
"Bu dönemde okullarda beden eğitimi dersleri yaygınlaştırılmış, stadyumlar (ör. 1936'da açılan Ankara 19 Mayıs Stadyumu) inşa edilmiş ve beden eğitimi öğretmeni yetiştirilmesine önem verilmiştir."],p:[3],sc:[3],
nsc:[["Erken Cumhuriyet döneminde spor neden devlet politikası hâline geldi?","Çünkü sağlıklı, disiplinli ve dayanıklı bir nesil yetiştirmek, ulusal birliği güçlendirmek ve modernleşmeyi halka yaymak hedefleniyordu. Bu nedenle TİCİ (1922), Halkevleri (1932) ve 3530 sayılı Beden Terbiyesi Kanunu (1938) gibi düzenlemelerle spor devlet eliyle örgütlendi ve okullarda beden eğitimi yaygınlaştırıldı."]]},
{h:15,b:"Güncel spor olayları",m:[
"Güncel spor olaylarını değerlendirirken olay, ilgili kurumlar (IOC, federasyonlar, kulüpler, devlet), toplumsal etkiler ve etik boyut birlikte ele alınmalıdır.",
"Büyük spor organizasyonları (olimpiyatlar, dünya kupaları) ekonomik yatırım, kent dönüşümü, turizm ve ülke tanıtımı ile ilişkilidir; maliyet ve sürdürülebilirlik tartışmalarına yol açar.",
"Medya ve sosyal medya sporcuları geniş kitlelere ulaştırır; aynı zamanda siber zorbalık, dezenformasyon ve aşırı ticarileşme gibi sorunları da beraberinde getirir.",
"Kadın sporunun görünürlüğü, sporcu ruh sağlığı, e-spor, doping ve sporda şiddet günümüzde en çok tartışılan konular arasındadır.",
"Sıradaki Yaz Olimpiyat Oyunları'nın 2028'de Los Angeles'ta, ardından 2032'de Brisbane'de düzenlenmesi planlanmaktadır."],
np:[{t:"Haberin arkasındaki spor",d:"Güncel spor olaylarını okumak",s:[
["H","Bu hafta sınıfa bir spor haberi getirdiğinizi düşünün. Onu nasıl incelersiniz?"],
["Ö","Önce ne olduğunu anlarız hocam, sonra kimin sorumlu olduğuna bakarız."],
["H","Güzel bir başlangıç. Ben dört soru öneriyorum: Ne oldu? Hangi kurumlar işin içinde? Toplumu nasıl etkiliyor? Etik açıdan nasıl değerlendirilir?"],
["Ö","Mesela büyük bir olimpiyat organizasyonu için?"],
["H","Ev sahibi kent için yatırım, ulaşım, turizm ve tanıtım fırsatıdır. Ama maliyet, kullanılmayan tesisler ve çevresel etkiler de tartışılır. Bu yüzden son yıllarda sürdürülebilirlik ön plana çıktı."],
["Ö","Sosyal medyanın da sporcular üzerinde büyük etkisi var."],
["H","Evet. Sporcular taraftarlarına doğrudan ulaşıyor, ama siber zorbalık ve baskı da artıyor. Sporcu ruh sağlığı artık en çok konuşulan konulardan biri. Kadın sporunun görünürlüğü ve e-spor da güncel tartışmalar arasında."],
["Ö","Sınıfta bu konuları nasıl işleyebiliriz?"],
["H","Öğrencilerden haftanın bir spor haberini seçip bu dört soruyla sunmalarını isteyin. Böylece hem güncel kalırlar hem de eleştirel düşünmeyi öğrenirler."]]}],
nsc:[["Bir spor haberini derste nasıl tartışmaya açabilirim?","Dört soruluk bir çerçeve kullanabilirsin: 1) Ne oldu? 2) Hangi kurum ve aktörler işin içinde (IOC, federasyon, kulüp, devlet, medya)? 3) Toplumsal ve ekonomik etkileri neler? 4) Etik açıdan nasıl değerlendirilir (fair play, adalet, sağlık)? Öğrencilerin kanıta dayalı konuşmasını ve farklı görüşleri dinlemesini teşvik et."]]}
]};

MU.ank={kod:"SBAE103",akts:"3",sinav:[],
weeks:[
{h:1,mf:1,b:"Anatomiye giriş ve temel kavramlar",m:[
"Anatomi, vücudun yapısını ve bu yapıların birbirleriyle ilişkisini inceleyen bilimdir; sistemik anatomi vücudu sistemlere göre, bölgesel (topografik) anatomi bölgelere göre inceler.",
"Vücudun organizasyon düzeyleri: hücre → doku → organ → sistem → organizma. Temel doku tipleri epitel, bağ, kas ve sinir dokusudur.",
"Hareket (lokomotor) sistemi kemikler, eklemler ve kaslardan oluşur; sinir sistemi hareketi yönetir, dolaşım ve solunum sistemleri enerjiyi sağlar.",
"Kinesiyoloji, insan hareketini anatomi, fizyoloji ve mekanik ilkeleri birleştirerek inceleyen bilimdir."],k:[1,5],p:[1,5],sc:[1,5]},
{h:2,b:"Hareket düzlemleri ve temel anatomik terminoloji",k:[0,4],p:[0,4],sc:[0,4]},
{h:3,b:"Bölgesel anatomi ve vücudumuzun bölgeleri",m:[
"Vücut başlıca baş (caput), boyun (collum), gövde (truncus), üst ekstremite ve alt ekstremite bölgelerine ayrılır; gövde de toraks, abdomen ve pelvis bölgelerini içerir.",
"Vücut boşlukları: dorsal boşluk (kafa boşluğu ve omurga kanalı) ile ventral boşluk (göğüs boşluğu ve karın-pelvis boşluğu); göğüs ve karın boşluklarını diyafram ayırır.",
"Üst ekstremite bölgeleri: omuz, kol (brachium), dirsek ön yüzü (kubital bölge), önkol (antebrachium), el bileği (karpal bölge) ve el.",
"Alt ekstremite bölgeleri: kalça ve gluteal bölge, uyluk (femoral bölge), diz arkası (popliteal bölge), bacak (crus), ayak bileği ve ayak; topuk bölgesine kalkaneal bölge denir.",
"Klinik ve sportif değerlendirmelerde bölge adlarının doğru kullanılması, sakatlıkların yerini tanımlamada ortak bir dil sağlar."],
np:[{t:"Vücudun haritası",d:"Bölgesel anatomi",s:[
["H","Bir sporcu “dizimin arkası ağrıyor” dediğinde bunu anatomik olarak nasıl ifade ederiz?"],
["Ö","Popliteal bölge hocam."],
["H","Mükemmel. Bölgesel anatomi vücudu bir harita gibi bölgelere ayırır. Baş, boyun, gövde, üst ekstremite ve alt ekstremite. Gövde de kendi içinde toraks, abdomen ve pelvis bölgelerine ayrılır."],
["Ö","Vücut boşlukları da bu konunun parçası mı?"],
["H","Evet. Dorsal boşlukta kafa boşluğu ve omurga kanalı, ventral boşlukta göğüs ve karın-pelvis boşluğu vardır. Göğüs ve karın boşluklarını diyafram ayırır."],
["Ö","Kolda hangi bölgeler var?"],
["H","Omuz, kol, dirseğin ön yüzü olan kubital bölge, önkol, el bileği yani karpal bölge ve el. Bacakta da uyluk, popliteal bölge, bacak, ayak bileği ve topuktaki kalkaneal bölge."],
["Ö","Bu terimleri neden bilmemiz gerekiyor?"],
["H","Çünkü sağlık ekibiyle, fizyoterapistle ya da hekimle aynı dili konuşmanız gerekir. Bir sakatlığı doğru tarif etmek, doğru yardımın ilk adımıdır."]]}],
nsc:[["Kubital, popliteal ve kalkaneal bölgeler nerededir?","Kubital bölge dirseğin ön yüzüdür (kan alınan bölge). Popliteal bölge dizin arka yüzüdür. Kalkaneal bölge topuk bölgesidir; aşil tendonu bu bölgede kalkaneusa yapışır."]]},
{h:4,b:"Baş ve boyun anatomisi",m:[
"Kafatası (cranium) beyni koruyan 8 kemikten oluşan nörokranyum (frontal, 2 parietal, 2 temporal, oksipital, sfenoid, etmoid) ve 14 kemikten oluşan yüz iskeletinden (viserokranyum) oluşur.",
"Mandibula (alt çene) kafatasının tek hareketli kemiğidir; temporomandibular eklem ile kafatasına bağlanır.",
"Servikal omurganın ilk iki omuru özeldir: Atlas (C1) ile oksipital kemik arasındaki eklem “evet” hareketini (fleksiyon-ekstansiyon), atlas ile axis (C2) arasındaki eklem “hayır” hareketini (rotasyon) sağlar.",
"Sternocleidomastoideus iki taraflı kasıldığında boynu büker; tek taraflı kasıldığında başı aynı tarafa yana eğer ve yüzü karşı tarafa döndürür.",
"Boynun arka yüzünde trapezius üst lifleri ve derin ense kasları başı dik tutar; skalen kaslar boynu yana büker ve zorlu solunumda kaburgaları kaldırır.",
"Boyun bölgesi temas sporlarında yaralanmalara açıktır; baş-boyun yaralanması şüphesinde kişi hareket ettirilmemeli ve acil yardım istenmelidir."],
np:[{t:"Evet ve hayır eklemleri",d:"Baş ve boyun anatomisi",s:[
["H","Başımızı “evet” der gibi sallarken hangi eklemde hareket ederiz?"],
["Ö","Atlas ile kafatası arasındaki eklemde mi hocam?"],
["H","Doğru, atlanto-oksipital eklem. “Hayır” der gibi başımızı çevirdiğimizde ise atlas ile axis arasındaki atlanto-aksiyal eklem çalışır. Atlas birinci, axis ikinci boyun omurudur."],
["Ö","Kafatasında kaç kemik var?"],
["H","Beyni koruyan nörokranyumda sekiz kemik, yüz iskeletinde on dört kemik bulunur. Mandibula, yani alt çene, kafatasının hareketli tek kemiğidir."],
["Ö","Boyundaki en belirgin kas sternocleidomastoideus, değil mi?"],
["H","Evet. İki taraflı kasılınca boynu büker. Tek taraflı kasılınca başı aynı tarafa eğer, yüzü karşı tarafa çevirir. Arka tarafta trapezius ve derin ense kasları başı dik tutar."],
["Ö","Sporda boyun neden bu kadar önemli?"],
["H","Çünkü temas sporlarında ciddi yaralanmalar olabilir. Boyun yaralanmasından şüphelendiğinizde kişiyi asla hareket ettirmeyin, acil yardım çağırın. Anatomi bilgisi burada hayat kurtarır."]]}],
nsc:[["Sternocleidomastoideus tek taraflı kasıldığında baş hangi yöne döner?","Başı kasıldığı tarafa doğru yana eğer, yüzü ise karşı tarafa döndürür. Örneğin sağ sternocleidomastoideus kasıldığında yüz sola döner. İki taraflı kasıldığında boyun fleksiyonu oluşur."]]},
{h:5,b:"Omurga anatomisi",k:[8],m:[
"Tipik bir omur; gövde (corpus vertebrae), omur kemeri (arcus vertebrae), dikensi çıkıntı (processus spinosus) ve yan çıkıntılardan (processus transversus) oluşur; omurilik omur deliğinden geçer.",
"Omurlar arasında yer alan intervertebral diskler dışta lifli halka (anulus fibrosus), içte jel kıvamında çekirdekten (nucleus pulposus) oluşur ve şok emici görev yapar.",
"Disk hernisi, çekirdeğin lifli halkadan taşarak sinirlere baskı yapmasıdır; ağır yükleri bel bükülü ve dönmüş hâlde kaldırmak riski artırır."],p:[8],sc:[8]},
{h:6,mf:1,b:"Üst ekstremite anatomisi",m:[
"Üst ekstremite kemikleri: omuz kuşağı (klavikula ve skapula), kol kemiği humerus, önkolda başparmak tarafında radius ve serçe parmak tarafında ulna, el bileğinde 8 karpal, avuçta 5 metakarpal ve parmaklarda 14 falanks.",
"Dirsek eklemi humerus, ulna ve radius arasında oluşur; humeroulnar eklem fleksiyon-ekstansiyonu, radioulnar eklemler pronasyon-supinasyonu sağlar."],k:[6],p:[6],sc:[6]},
{h:7,b:"Toraks bölgesi anatomisi",m:[
"Göğüs kafesi (toraks) 12 torakal omur, 12 çift kaburga ve sternumdan oluşur; kalp ve akciğerleri korur.",
"Kaburgaların ilk 7 çifti doğrudan sternuma bağlanan gerçek kaburgalar, 8–10. çiftler yalancı kaburgalar, 11 ve 12. çiftler ön uçları serbest olan yüzen kaburgalardır.",
"Sternum üç bölümden oluşur: manubrium, gövde (corpus) ve ksifoid çıkıntı; kalp masajında baskı sternumun alt yarısına uygulanır.",
"Sakin solunumda inspirasyonu diyafram ve dış interkostal kaslar sağlar, ekspirasyon büyük ölçüde pasiftir; zorlu solunumda sternocleidomastoideus, skalenler ve pectoralis minor inspirasyona, iç interkostaller ve karın kasları ekspirasyona yardım eder.",
"Göğüs boşluğunun ortasındaki mediastinumda kalp, büyük damarlar, soluk borusu (trakea) ve yemek borusu (özofagus) bulunur."],
np:[{t:"Nefesin mimarisi",d:"Toraks ve solunum kasları",s:[
["H","Göğüs kafesini oluşturan yapılar nelerdir?"],
["Ö","On iki torakal omur, on iki çift kaburga ve sternum hocam."],
["H","Doğru. İlk yedi çift kaburga doğrudan sternuma bağlanır, bunlara gerçek kaburgalar denir. Sekiz, dokuz ve onuncu çiftler yalancı, son iki çift ise yüzen kaburgalardır."],
["Ö","Nefes alırken hangi kaslar çalışıyor?"],
["H","Sakin solunumda diyafram ve dış interkostal kaslar. Diyafram kasılınca aşağı iner, göğüs boşluğu genişler ve hava içeri dolar. Sakin nefes verme ise büyük ölçüde pasiftir."],
["Ö","Koşarken nefes nefese kaldığımızda başka kaslar da devreye giriyor."],
["H","Evet. Zorlu nefes almada sternocleidomastoideus, skalenler ve pectoralis minor; zorlu nefes vermede iç interkostaller ve karın kasları yardım eder. Yorgun sporcunun omuzlarının nefesle inip kalkması bu yüzdendir."],
["Ö","Sternumun ilk yardımla bir ilgisi var mı?"],
["H","Kesinlikle. Kalp masajında baskı sternumun alt yarısına uygulanır. Bir beden eğitimi öğretmeni için bu bilgi hayati önem taşır."]]}],
nsc:[["Gerçek, yalancı ve yüzen kaburgalar arasındaki fark nedir?","Gerçek kaburgalar (1–7. çiftler) kendi kıkırdaklarıyla doğrudan sternuma bağlanır. Yalancı kaburgalar (8–10. çiftler) sternuma dolaylı olarak, üstteki kaburganın kıkırdağı aracılığıyla bağlanır. Yüzen kaburgaların (11–12. çiftler) ön uçları serbesttir."]]},
{h:8,b:"Abdominal bölge anatomisi",m:[
"Karın ön duvarını rectus abdominis, dış oblik (obliquus externus), iç oblik (obliquus internus) ve en derinde transversus abdominis kasları oluşturur; rectus abdominis'in iki yarısını linea alba ayırır.",
"Rectus abdominis gövdeyi öne büker; dış oblik gövdeyi karşı tarafa, iç oblik aynı tarafa döndürür; obliklerin tek taraflı kasılması gövdeyi yana büker.",
"Transversus abdominis karın içi basıncı artırarak gövdeyi bir korse gibi sabitler; karın arka duvarındaki quadratus lumborum gövdeyi yana büker ve pelvisi sabitler.",
"Karın bölgesi klinik değerlendirmede dört kadrana veya dokuz bölgeye (ör. epigastrik, umbilikal, hipogastrik) ayrılır; karın boşluğunda mide, bağırsaklar, karaciğer, dalak ve böbrekler gibi organlar bulunur.",
"Ağır kaldırmalarda karın kaslarının ve diyaframın birlikte kasılması karın içi basıncı artırarak omurgayı destekler."],
np:[{t:"Doğal korse",d:"Karın kasları",s:[
["H","Karın kaslarını katman katman sayalım. En yüzeyde ne var?"],
["Ö","Rectus abdominis hocam, halk arasında “six pack” denen kas."],
["H","Doğru. İki yarısını linea alba ayırır, görevi gövdeyi öne bükmektir. Yanlarda dış ve iç oblikler var. Dış oblik gövdeyi karşı tarafa, iç oblik aynı tarafa döndürür."],
["Ö","En derindeki kas transversus abdominis."],
["H","Evet, bir korse gibi gövdeyi sarar ve karın içi basıncı artırır. Ağır bir yük kaldırırken karın kasları ve diyafram birlikte kasılır, bu basınç omurgayı destekler."],
["Ö","Karın arkasında da kas var mı?"],
["H","Quadratus lumborum. Gövdeyi yana büker ve pelvisi sabitler. Bel ağrılarında sıkça adı geçer."],
["Ö","Organlar açısından karın bölgesini nasıl ayırıyoruz?"],
["H","Dört kadrana ya da dokuz bölgeye. Mesela midenin bulunduğu üst orta bölgeye epigastrik bölge denir. Bir öğrenci karın ağrısı tarif ettiğinde bu dili bilmek, sağlık ekibine doğru bilgi vermenizi sağlar."]]}],
nsc:[["Dış oblik ve iç oblik kaslar gövdeyi hangi yöne döndürür?","Dış oblik gövdeyi karşı tarafa, iç oblik aynı tarafa döndürür. Örneğin gövdeyi sağa döndürürken sol dış oblik ve sağ iç oblik birlikte çalışır."]]},
{h:9,b:"Pelvis ve kalça anatomisi",m:[
"Pelvis iki kalça kemiği (os coxae), sakrum ve koksiksten oluşur; her kalça kemiği ilium, iskium ve pubis kemiklerinin asetabulumda kaynaşmasıyla oluşur.",
"Kadın pelvisi doğuma uygun olarak daha geniş ve yayvandır; pubik açı kadınlarda erkeklere göre daha geniştir.",
"Kalça eklemi, femur başı ile asetabulum arasında oluşan top-yuva tipi bir eklemdir; derin yuvası ve güçlü bağları sayesinde omuzdan çok daha stabildir.",
"İliofemoral bağ (Y bağı) vücudun en güçlü bağlarından biridir ve kalçanın aşırı ekstansiyonunu sınırlar.",
"Kalça kasları: fleksör iliopsoas, ekstansör gluteus maximus, abdüktörler gluteus medius ve minimus, adduktor grup ve piriformisin de içinde bulunduğu derin dış rotatorlar."],
np:[{t:"Gövdenin temeli",d:"Pelvis ve kalça",s:[
["H","Pelvisi oluşturan kemikleri sayalım."],
["Ö","İki kalça kemiği, sakrum ve koksiks hocam."],
["H","Doğru. Her kalça kemiği aslında üç kemiğin kaynaşmasıyla oluşur: ilium, iskium ve pubis. Üçü asetabulumda birleşir, yani kalça ekleminin yuvasında."],
["Ö","Kalça eklemi omuz gibi top-yuva eklem ama daha az çıkıyor."],
["H","Çünkü yuvası derindir ve çok güçlü bağlarla desteklenir. İliofemoral bağ, yani Y bağı, vücudun en güçlü bağlarından biridir ve kalçanın aşırı geriye gitmesini engeller."],
["Ö","Kadın ve erkek pelvisi farklı mı?"],
["H","Evet, kadın pelvisi doğuma uygun olarak daha geniş ve yayvandır, pubik açı daha geniştir. Bu fark, kadın sporcularda diz hizalanmasını da etkileyebilir."],
["Ö","Kalça kaslarını da gruplayalım mı?"],
["H","Öne büken iliopsoas, geriye açan gluteus maximus, yana açan gluteus medius ve minimus, içe toplayan adduktorlar ve dışa döndüren derin rotatorlar. Piriformis bu derin rotatorlardan biridir ve siyatik sinirle komşuluğu nedeniyle sık konuşulur."]]}],
nsc:[["Kalça eklemi neden omuz ekleminden daha stabildir?","Kalçada femur başı derin bir yuvaya (asetabulum) oturur ve çok güçlü bağlarla (özellikle iliofemoral bağ) desteklenir. Omuzda ise yuva sığdır ve stabilite büyük ölçüde kaslara bağlıdır. Bu yüzden omuz daha hareketli ama daha az stabil, kalça daha stabil ama daha az hareketlidir."]]},
{h:10,mf:1,b:"Alt ekstremite anatomisi",m:[
"Alt ekstremite kemikleri: femur (vücudun en uzun ve güçlü kemiği), patella, bacağın iç tarafında yük taşıyan tibia ve dış tarafında fibula, ayakta 7 tarsal, 5 metatarsal ve 14 falanks.",
"Diz eklemi tibiofemoral ve patellofemoral eklemlerden oluşur; medial ve lateral menisküsler yükü dağıtır ve eklemi stabilize eder.",
"Ön çapraz bağ (ACL) tibianın öne kaymasını, arka çapraz bağ (PCL) geriye kaymasını önler; iç ve dış yan bağlar (MCL, LCL) dizin yana açılmasını sınırlar.",
"Ani yön değiştirme, kötü iniş ve dizin içe çökmesi (dinamik valgus) ön çapraz bağ yaralanmalarının başlıca risk etkenleridir."],k:[7],p:[7],sc:[7]},
{h:11,b:"Omuz kompleksi eklemleri ve kinesiyolojisi",k:[2],m:[
"Omuz kompleksi dört eklemden oluşur: glenohumeral, akromioklavikular, sternoklavikular eklemler ve kürek kemiğinin göğüs kafesi üzerinde kaydığı işlevsel skapulotorasik eklem.",
"Skapulohumeral ritim: Kolun yana kaldırılmasında hareketin yaklaşık 2/3'ü glenohumeral eklemde, 1/3'ü skapulanın yukarı rotasyonuyla gerçekleşir (yaklaşık 2:1 oranı).",
"Rotator manşet kasları humerus başını yuvada tutar; supraspinatus tendonunun akromion altında sıkışması (sıkışma sendromu) baş üstü sporlarda sık görülür.",
"Omuz sağlığı için rotator manşet ve skapula stabilizatörlerinin (serratus anterior, alt ve orta trapez) güçlendirilmesi önerilir."],p:[2],sc:[2]},
{h:12,b:"Lumbopelvik kompleks eklemleri ve kinesiyolojisi",m:[
"Lumbopelvik kompleks bel omurgası, sakroiliak eklemler, pelvis ve kalça eklemlerinden oluşan ve gövde ile bacaklar arasında kuvvet aktaran işlevsel bir bütündür.",
"Lumbopelvik ritim: Öne eğilirken hareket bel omurgasının fleksiyonu ve kalçanın fleksiyonu (pelvisin öne dönmesi) ile birlikte gerçekleşir.",
"Pelvisin öne eğilmesi (anterior tilt) bel çukurluğunu artırır; kalça fleksörlerinin kısalığı ve zayıf karın kasları bu duruma katkı yapar.",
"Pelvisin arkaya eğilmesi (posterior tilt) bel çukurluğunu azaltır; hamstring kısalığı bu duruma katkı yapabilir.",
"Gövde (core) kaslarının dengeli çalışması bel omurgasını nötral pozisyonda korur ve bel ağrısı riskini azaltır."],
np:[{t:"Belin ve kalçanın dansı",d:"Lumbopelvik kompleks",s:[
["H","Yerdeki bir topu almak için öne eğildiğinizde yalnızca beliniz mi bükülür?"],
["Ö","Sanırım kalçamız da bükülüyor hocam."],
["H","Tam olarak. Bel omurgasının fleksiyonu ile kalçanın fleksiyonu birlikte gerçekleşir. Buna lumbopelvik ritim deriz. Bel, sakroiliak eklemler, pelvis ve kalça işlevsel bir bütündür."],
["Ö","Pelvik tilt kavramını da duyuyoruz."],
["H","Pelvis öne eğildiğinde, yani anterior tiltte, bel çukurluğu artar. Kalça fleksörlerinin kısalığı ve zayıf karın kasları buna katkı yapar. Pelvis arkaya eğildiğinde, yani posterior tiltte, bel düzleşir; hamstring kısalığı buna yol açabilir."],
["Ö","Bunun bel ağrısıyla ilgisi var mı?"],
["H","Var. Kaslar dengesizse bel sürekli tek yöne zorlanır. Gövde kaslarını dengeli güçlendirmek ve kalça kaslarının esnekliğini korumak beli nötral pozisyonda tutar."],
["Ö","Derste bunu nasıl gözlemleriz?"],
["H","Öğrenciden öne eğilmesini isteyin ve belin mi yoksa kalçanın mı daha çok hareket ettiğine bakın. Gözlem, doğru egzersiz seçiminin ilk adımıdır."]]}],
nsc:[["Anterior ve posterior pelvik tilt arasındaki fark nedir?","Anterior tiltte pelvisin önü aşağı iner, bel çukurluğu (lordoz) artar; kalça fleksörlerinin kısalığı ve zayıf karın kasları buna katkı yapar. Posterior tiltte pelvisin önü yukarı kalkar, bel düzleşir; hamstring kısalığı buna katkı yapabilir."]]},
{h:13,b:"Ayak ve ayak bileği eklemleri ve kinesiyolojisi",m:[
"Talokrural eklem (tibia, fibula ve talus arasında) ayak bileğinin dorsifleksiyon ve plantar fleksiyon hareketlerini sağlar.",
"Subtalar eklem (talus ile kalkaneus arasında) ayağın inversiyon ve eversiyon hareketlerini sağlar.",
"Ayakta medial longitudinal, lateral longitudinal ve transvers olmak üzere üç ark bulunur; arklar ve plantar fasya yükü dağıtır ve yürüyüşte yay görevi görür.",
"Ayak bileği burkulmalarının çoğu inversiyon sırasında olur ve en sık dış yan bağlar (özellikle ön talofibular bağ) etkilenir.",
"Denge ve propriosepsiyon çalışmaları ayak bileği burkulmalarını önlemede etkilidir."],
np:[{t:"Yere ilk değen",d:"Ayak ve ayak bileği",s:[
["H","Ayak bileğini yukarı aşağı oynattığınızda hangi eklem çalışır?"],
["Ö","Talokrural eklem hocam, tibia, fibula ve talus arasında."],
["H","Doğru, dorsifleksiyon ve plantar fleksiyon burada olur. Ayak tabanını içe ve dışa çevirdiğinizde ise talus ile kalkaneus arasındaki subtalar eklem çalışır: inversiyon ve eversiyon."],
["Ö","Burkulmalar en çok hangi yönde oluyor?"],
["H","İnversiyonda. Ayak içe döner ve dış yan bağlar gerilir; en sık ön talofibular bağ yaralanır. Basketbolda birinin ayağına basarak inmek klasik bir örnektir."],
["Ö","Ayak arkları ne işe yarar?"],
["H","Üç ark vardır: iç uzun ark, dış uzun ark ve enine ark. Plantar fasya ile birlikte yükü dağıtır ve yürürken bir yay gibi enerji depolar."],
["Ö","Burkulmaları önlemek için ne yapabiliriz?"],
["H","Denge ve propriosepsiyon çalışmaları, yani tek ayak üstünde, dengesiz zeminlerde yapılan egzersizler. Isınma programlarına eklemek, burkulma riskini belirgin biçimde azaltır."]]}],
nsc:[["Ayak bileği burkulması neden çoğunlukla dış tarafta olur?","Burkulmaların çoğu ayak içe döndüğünde (inversiyon) gerçekleşir. Bu hareket ayak bileğinin dış yan bağlarını, özellikle ön talofibular bağı gerer. Ayrıca dış malleol (fibulanın ucu) daha aşağıda olduğu için eversiyonu sınırlar, inversiyon ise daha kolay ve geniş gerçekleşir."]]},
{h:14,b:"Uygulamalı üst ekstremite egzersiz kinesiyolojisi",m:[
"Şınavın itiş evresinde pectoralis major, deltoidin ön lifleri ve triceps konsantrik, iniş evresinde eksantrik çalışır; serratus anterior skapulayı sabitler, gövde kasları izometrik olarak vücudu düz tutar.",
"Barfiks ve kürek çekme hareketlerinde latissimus dorsi, biceps, brachialis, rhomboidler ve trapezin orta-alt lifleri çalışır.",
"Baş üstü pres hareketinde deltoid ve triceps ana kaslardır; skapulanın yukarı rotasyonunu trapez ve serratus anterior sağlar.",
"Bir egzersizi analiz ederken: eklem hareketleri, hareket düzlemi, ana kaslar, kasılma türü ve sabitleyici kaslar sırayla belirlenir."],k:[3,9],p:[3,9],sc:[3,9]},
{h:15,b:"Uygulamalı bel ve abdominal bölge egzersiz kinesiyolojisi",m:[
"Mekik (crunch) hareketinde rectus abdominis gövdeyi öne büker; ayaklar sabitlenmiş tam mekikte kalça fleksörleri (iliopsoas) belirgin biçimde devreye girer ve bel omurgasına binen yük artar.",
"Plank hareketinde rectus abdominis, transversus abdominis ve oblikler izometrik olarak çalışır; yan plank obliklere, quadratus lumborum'a ve gluteus medius'a yüklenir.",
"Bird-dog (dört ayak üstünde çapraz kol-bacak uzatma) erector spinae ve gluteus maximus'u omurgayı nötral tutarak çalıştırır.",
"Yerden yük kaldırmada (deadlift) kalça ekstansörleri (gluteus maximus, hamstringler) hareketi yapar; erector spinae izometrik kasılarak omurgayı nötral pozisyonda tutar.",
"Bel sağlığı için egzersizlerde omurganın nötral pozisyonu, kontrollü hareket ve kademeli yüklenme ilkeleri uygulanır."],
np:[{t:"Mekik mi, plank mı?",d:"Bel ve karın egzersizlerinin analizi",s:[
["H","Mekik ile plank arasında kinesiyolojik fark nedir?"],
["Ö","Mekikte gövde hareket ediyor, plankta sabit duruyoruz hocam."],
["H","Doğru. Mekikte rectus abdominis gövdeyi öne büker. Ama ayakları sabitlenmiş tam mekikte iliopsoas da devreye girer ve bel omurgasına binen yük artar. Plankta ise karın kasları izometrik olarak çalışır."],
["Ö","Yan plank hangi kasları çalıştırır?"],
["H","Oblikleri, quadratus lumborum'u ve gluteus medius'u. Bird-dog ise dört ayak üstünde çapraz kol ve bacağı uzatarak erector spinae ve gluteus maximus'u omurgayı nötral tutarak çalıştırır."],
["Ö","Yerden yük kaldırırken bel nasıl korunur?"],
["H","Deadlift hareketinde kalça ekstansörleri yükü kaldırır; erector spinae izometrik kasılarak omurgayı nötral tutar. Hata, kalça yerine beli bükerek kaldırmaktır."],
["Ö","Öğrencilere hangi ilkeleri vermeliyiz?"],
["H","Nötral omurga, kontrollü hareket ve kademeli yüklenme. Önce tekniği öğretin, sonra tekrar sayısını, en son yükü artırın."]]}],
nsc:[["Ayakları sabitlenmiş tam mekik neden öğrenciler için ilk tercih olmamalı?","Ayaklar sabitlendiğinde hareketin önemli bir kısmını kalça fleksörleri (iliopsoas) yapar; iliopsoas bel omurlarına yapıştığı için bele binen yük artar. Karın kaslarını hedeflemek için kısa mekik (crunch), plank ve yan plank gibi omurgayı daha az zorlayan egzersizler tercih edilebilir."]]},
{h:16,b:"Uygulamalı alt ekstremite egzersiz kinesiyolojisi",m:[
"Squat hareketinde quadriceps ve gluteus maximus ana kaslardır; inişte eksantrik, kalkışta konsantrik çalışırlar. Dizlerin ayak uçlarıyla aynı doğrultuda kalması ve içe çökmemesi önemlidir.",
"Lunge (hamle) hareketi her bacağı ayrı çalıştırır ve dengeyi de geliştirir; öndeki bacakta quadriceps ve gluteus maximus, kalça stabilitesinde gluteus medius görev alır.",
"Parmak ucunda yükselme (calf raise) gastrocnemius ve soleusu çalıştırır ve ikinci sınıf kaldıraca örnektir.",
"Sıçrama sonrası inişte kalça, diz ve ayak bileğinin bükülerek kuvveti eksantrik olarak emmesi, ön çapraz bağ yaralanma riskini azaltır."],k:[10,11],p:[10,11],sc:[10,11]},
{h:17,b:"Dönem özeti ve tekrar",m:[
"Temel kavramlar: anatomik pozisyon, düzlemler ve eksenler, yön ve hareket terimleri bütün konuların ortak dilidir.",
"Bölgesel anatomi: baş-boyun, omurga, toraks, abdomen, pelvis-kalça, üst ve alt ekstremitenin kemik, eklem ve kas yapıları.",
"Kinesiyoloji: omuz kompleksi, lumbopelvik kompleks ve ayak-ayak bileğinin işlevsel analizi; kaldıraçlar ve biyomekanik ilkeler.",
"Uygulama: egzersizlerin eklem hareketi, düzlem, kas ve kasılma türüne göre analizi ile sakatlık risklerinin değerlendirilmesi.",
"Sınava hazırlıkta her bölge için “kemikler, eklemler, kaslar, hareketler, sık yaralanmalar” başlıklarıyla özet tablo hazırlamak etkili bir yöntemdir."],
np:[{t:"Dönemin haritası",d:"Tekrar ve sınava hazırlık",s:[
["H","Dönemi bitirirken büyük resme bakalım. Bu derste neyi öğrendik?"],
["Ö","Önce anatominin dilini öğrendik hocam: düzlemler, eksenler, yön ve hareket terimleri."],
["H","Evet, bu dil her şeyin temeli. Sonra vücudu bölge bölge gezdik: baş ve boyun, omurga, toraks, abdomen, pelvis ve kalça, üst ve alt ekstremite."],
["Ö","Dönemin ikinci yarısında da kinesiyolojiye geçtik."],
["H","Doğru. Omuz kompleksini, lumbopelvik kompleksi, ayak ve ayak bileğini işlevsel olarak inceledik. Son haftalarda da egzersizleri analiz ettik: şınav, barfiks, plank, squat, lunge."],
["Ö","Sınava nasıl çalışmamızı önerirsiniz?"],
["H","Her bölge için beş başlıklı bir tablo hazırlayın: kemikler, eklemler, kaslar, hareketler ve sık görülen yaralanmalar. Sonra bir egzersiz seçip eklem hareketlerini, düzlemi, ana kasları ve kasılma türünü yazın. Bunu yapabiliyorsanız dersi gerçekten öğrenmişsiniz demektir."]]}],
nsc:[["Anatomi ve kinesiyoloji sınavına nasıl çalışmalıyım?","Her vücut bölgesi için “kemikler, eklemler, kaslar, hareketler, sık yaralanmalar” başlıklı özet tablolar hazırla. Ardından bildiğin egzersizleri (şınav, squat, plank) eklem hareketi, hareket düzlemi, ana kaslar ve kasılma türü açısından analiz etmeyi dene. Uygulamadaki testleri ve boşluk doldurma sorularını düzenli çözmek de tekrar sağlar."]]}
]};

sinav:[{h:9,b:"Vize haftası"},{h:16,b:"Sınav çalışmaları"},{h:17,b:"Sınav çalışmaları"}],
weeks:[
{h:1,b:"Hareket eğitiminin tarihçesi ve felsefesi",m:[
"Hareket eğitiminin kuramsal temeli Rudolf Laban'ın (1879–1958) hareket analizine dayanır; Laban'ın 1948'de yayımlanan “Modern Educational Dance” adlı eseri okullarda hareket eğitimini etkilemiştir.",
"Hareket eğitimi 1940–50'lerde İngiltere'de ilkokullarda yaygınlaşmış, 1960'lı yıllardan itibaren ABD'de beden eğitimi programlarını etkilemiştir.",
"Felsefesi öğrenci merkezlidir: keşfederek öğrenme, problem çözme, bireysel farklılıklara saygı ve her çocuğun başarabileceği görevler.",
"Amaç, belirli spor tekniklerinden önce çocuğa geniş bir hareket dağarcığı ve hareket yetkinliği kazandırmaktır.",
"Beceri teması yaklaşımı (Graham, Holt/Hale ve Parker, Children Moving) temel hareket becerilerini Laban'ın hareket kavramlarıyla birleştirerek öğretir; Türkiye'de ilkokul “Oyun ve Fiziki Etkinlikler” programı da hareket yetkinliğini hedefler."],
np:[{t:"Laban'dan sınıfa",d:"Hareket eğitiminin tarihçesi ve felsefesi",s:[
["H","Hareket eğitimi nereden çıktı, biliyor musunuz?"],
["Ö","Rudolf Laban'ın adını duymuştuk hocam."],
["H","Evet. Laban bir dans kuramcısıydı ve insan hareketini vücut, alan, çaba ve ilişki boyutlarıyla analiz etti. 1948'de yayımladığı Modern Educational Dance adlı eseri okullarda hareket eğitimini derinden etkiledi."],
["Ö","Bu yaklaşım okullara nasıl girdi?"],
["H","Önce 1940 ve 50'lerde İngiltere'deki ilkokullarda yaygınlaştı, 1960'lardan itibaren de ABD'ye yayıldı. Bugün Children Moving gibi kitaplarda beceri teması yaklaşımı olarak karşımıza çıkıyor."],
["Ö","Felsefesi nedir?"],
["H","Öğrenci merkezli olmak. Öğretmen “şunu böyle yap” demek yerine “kaç farklı şekilde yapabilirsin?” diye sorar. Çocuk keşfeder, problem çözer ve kendi düzeyinde başarılı olur."],
["Ö","Türkiye'deki programla ilişkisi var mı?"],
["H","Evet. İlkokul Oyun ve Fiziki Etkinlikler dersi de hareket yetkinliğini hedefler. Yani bu derste öğreneceğiniz yaklaşım, ilkokuldaki çocuklarla doğrudan kullanacağınız yaklaşımdır."]]}],
nsc:[["Hareket eğitimi ile geleneksel spor tekniği öğretimi arasındaki fark nedir?","Geleneksel yaklaşımda öğretmen belirli bir tekniği gösterir ve öğrenciler aynı şekilde tekrar eder. Hareket eğitiminde ise öğrenciler vücut, alan, çaba ve ilişki kavramlarıyla hareketi keşfeder; öğretmen soru ve problemlerle yönlendirir. Amaç tek bir tekniği değil, geniş bir hareket dağarcığı ve yetkinlik kazandırmaktır."]]},
{h:2,b:"Hareketin çocukluk dönemindeki önemi",m:[
"Hareket, çocuğun bedensel gelişiminin yanı sıra bilişsel (problem çözme, dikkat), duygusal (öz güven) ve sosyal (paylaşma, işbirliği) gelişimini de destekler.",
"Çocukluk dönemi temel hareket becerilerinin kazanılması için en uygun dönemdir; bu dönemde kazanılan hareket yetkinliği ileriki yaşlarda fiziksel aktiviteye katılımın en güçlü belirleyicilerindendir.",
"Dünya Sağlık Örgütü 5–17 yaş grubundaki çocuklara günde ortalama en az 60 dakika orta-şiddetli fiziksel aktivite önerir.",
"Hareketsizlik çocuklarda obezite, düşük kemik yoğunluğu ve zayıf motor becerilerle ilişkilidir; ayrıca akran ilişkilerini ve okul başarısını olumsuz etkileyebilir."],k:[4],p:[1,4],sc:[4],
nsc:[["Hareket yetkinliği neden yaşam boyu aktif olmanın anahtarı sayılıyor?","Temel hareket becerilerinde kendini yetkin hisseden çocuk oyunlara ve sporlara daha istekli katılır; katıldıkça daha da gelişir. Becerileri yetersiz kalan çocuk ise başarısızlık ve dışlanma yaşayıp etkinliklerden uzaklaşabilir. Bu nedenle çocuklukta kazanılan hareket yetkinliği, ergenlik ve yetişkinlikteki fiziksel aktivite düzeyinin güçlü bir belirleyicisidir."]]},
{h:3,b:"Hareket eğitimi kavramları",k:[0],p:[0],sc:[0]},
{h:4,b:"Vücut aktiviteleri ve alan aktiviteleri I: Vücut farkındalığı",k:[5],m:[
"Vücut aktivitelerinde çocuk vücut parçalarını tanır ve hareketlerini keşfeder: baş, gövde, kollar, bacaklar; bükülme, gerilme, dönme, sallanma, kıvrılma.",
"Vücut şekilleri: geniş-dar, kıvrık-düz, simetrik-asimetrik; çocuklar bu şekilleri yerinde ve hareket hâlinde oluşturur.",
"Örnek etkinlik: “Vücudunla bir köprü yap; şimdi yalnızca üç vücut parçası yere değsin” gibi görevler hem vücut farkındalığını hem dengeyi geliştirir."],p:[5],sc:[5]},
{h:5,b:"Vücut aktiviteleri ve alan aktiviteleri II: Alan farkındalığı",m:[
"Alan farkındalığı, vücudun nereye hareket ettiğini bilmektir: kişisel alan (yerinden ayrılmadan uzanılabilen alan) ve genel alan (herkesin paylaştığı hareket alanı).",
"Yönler: ileri, geri, sağa, sola, yukarı, aşağı; düzeyler: alçak, orta, yüksek.",
"Yollar (yörüngeler): düz, eğri, zikzak; uzantılar: hareketin geniş ya da küçük, vücuda yakın ya da uzak yapılması.",
"Örnek etkinlik: “Genel alanda zikzak yolda koş, düdükte alçak düzeyde dur” görevi çarpışmadan hareket etmeyi ve yön değiştirmeyi öğretir.",
"Alan farkındalığı geliştikçe öğrenciler oyunlarda boş alanı görme ve kullanma becerisi kazanır; bu, takım sporlarındaki taktik düşünmenin temelidir."],
np:[{t:"Kişisel balon",d:"Alan farkındalığı",s:[
["H","Küçük çocuklara kişisel alanı anlatırken nasıl bir benzetme kullanırız?"],
["Ö","Bir balonun içindeymiş gibi düşünmelerini isteyebiliriz hocam."],
["H","Harika. Kişisel balon. Yerinden ayrılmadan kollarını açtığında dokunabildiği alan kişisel alandır. Herkesin paylaştığı salon ise genel alandır."],
["Ö","Alan farkındalığının başka hangi boyutları var?"],
["H","Yönler: ileri, geri, yana, yukarı, aşağı. Düzeyler: alçak, orta, yüksek. Yollar: düz, eğri, zikzak. Bir de uzantılar: hareketi geniş ya da küçük yapmak."],
["Ö","Bunları oyunla nasıl çalışırız?"],
["H","Mesela: “Genel alanda zikzak yolda koş, düdükte alçak düzeyde heykel ol.” Çocuk hem yön değiştirmeyi hem de başkalarına çarpmadan hareket etmeyi öğrenir."],
["Ö","Bu, ileride takım sporlarına da yansır mı?"],
["H","Kesinlikle. Boş alanı görmek ve oraya koşmak, futbolda da basketbolda da taktiğin temelidir. Alan farkındalığı küçük yaşta kazanılan bir oyun zekâsıdır."]]}],
nsc:[["Kişisel alan ile genel alan nasıl öğretilir?","Önce her çocuğa yerde bir nokta (çember, kon) verip kollarını açarak etrafında dönmesini ve “balonunun” içinde kalmasını iste: bu kişisel alandır. Sonra salonda serbestçe dolaşırken kimseye ve hiçbir balona çarpmadan hareket etmelerini iste: bu genel alandır. Hız ve yön değişiklikleriyle görevi zorlaştırabilirsin."]]},
{h:6,b:"Hareket ilişkileri ve uygulamaları",m:[
"Hareket ilişkileri, hareketin “kiminle ya da neyle” yapıldığını anlatır: vücut parçaları arasındaki ilişkiler, nesnelerle ilişkiler ve insanlarla ilişkiler.",
"Vücut parçalarının ilişkisi: yakın-uzak, üstte-altta, önde-arkada, simetrik-asimetrik.",
"Nesnelerle ilişkiler: üstünde-altında, içinde-dışında, önünde-arkasında, yanında, çevresinde, üzerinden; çember, kon, ip ve engeller kullanılır.",
"İnsanlarla ilişkiler: eşle aynalama (karşılıklı ve ters taraf) ve gölgeleme (arkadan ve aynı taraf), lider-izleyici, birlikte-ayrı, karşılaşma-ayrılma; grup ve takım içinde işbirliği.",
"İlişki kavramları hem sosyal becerileri hem de oyunlardaki eşleşme, markaj ve pas gibi taktik davranışları geliştirir."],
np:[{t:"Ayna ve gölge",d:"Hareket ilişkileri",s:[
["H","Hareket ilişkileri “kiminle ya da neyle?” sorusunu yanıtlar. İlk ilişki türü nedir?"],
["Ö","Vücut parçalarının birbirleriyle ilişkisi hocam. Mesela elleri dizlere yakın tutmak."],
["H","Doğru. İkincisi nesnelerle ilişkiler: çemberin içinde, ipin üzerinden, konun çevresinde. Küçük çocuklar bu kavramları hareket ederek çok daha kolay öğrenir."],
["Ö","Üçüncüsü de insanlarla ilişkiler."],
["H","Evet. Aynalama ve gölgeleme klasik etkinliklerdir. Aynalamada eşler karşılıklı durur ve biri diğerinin hareketini ayna gibi yapar. Gölgelemede biri arkada durup önündekini aynı taraftan taklit eder."],
["Ö","Lider-izleyici de bu gruba giriyor."],
["H","Evet, ayrıca birlikte-ayrı hareket, karşılaşma ve ayrılma. Bu ilişkiler sosyal becerileri geliştirir ve ileride takım oyunlarındaki markaj, pas ve boşa çıkma davranışlarının temelini oluşturur."]]}],
nsc:[["Aynalama ile gölgeleme arasındaki fark nedir?","Aynalamada eşler karşı karşıya durur ve izleyen öğrenci liderin hareketini ayna görüntüsü gibi yapar (lider sağ elini kaldırınca izleyen sol elini kaldırır). Gölgelemede izleyen öğrenci liderin arkasında durur ve hareketi aynı taraftan, aynı yönde yapar."]]},
{h:7,b:"Hareket analiz diyagramının kullanımı ve uygulamaları",m:[
"Hareket analiz diyagramı (hareket analizi çerçevesi), hareket kavramlarını (vücut, alan, çaba, ilişki) ve beceri temalarını (yer değiştirme, nesne kontrolü, dengeleme) tek bir şemada bir araya getirir.",
"Öğretmen bir beceriyi seçer (ör. sekme) ve diyagramdaki kavramlarla çeşitlendirir: farklı düzeylerde sekme, zikzak yolda sekme, hızlı-yavaş sekme, eşle sekme.",
"Görev geliştirme (Rink): bilgilendirme (görevi tanıtma), genişletme (zorluğu ya da çeşitliliği artırma), arındırma (niteliği geliştirme) ve uygulama (oyun ya da yarışma içinde kullanma).",
"Diyagram ders planlamada, öğrenci gözleminde ve değerlendirmede ortak bir dil sağlar."],
np:[{t:"Bir beceriden yüz görev",d:"Hareket analiz diyagramı",s:[
["H","Elinizde tek bir beceri var: sekme. Bundan kaç farklı görev üretebilirsiniz?"],
["Ö","Sağ ayakla, sol ayakla... Belki beş on tane hocam."],
["H","Hareket analiz diyagramını kullanırsanız onlarca. Diyagram bir yanda vücut, alan, çaba ve ilişki kavramlarını, diğer yanda yer değiştirme, nesne kontrolü ve dengeleme becerilerini gösterir."],
["Ö","Yani sekmeyi bu kavramlarla birleştiriyoruz."],
["H","Evet. Alçak düzeyde sek, zikzak yolda sek, hızlı ve yavaş sek, eşinle aynı ritimde sek, bir çemberin içine ve dışına sek. Her biri farklı bir öğrenme fırsatıdır."],
["Ö","Görev geliştirme kavramını da duyduk."],
["H","Judith Rink'in modeli. Önce görevi tanıtırsınız, sonra genişletirsiniz, yani çeşitlendirir ya da zorlaştırırsınız. Ardından arındırırsınız, yani niteliği düzeltirsiniz. En sonda da oyunda uygulatırsınız. Diyagram ve bu model birlikte iyi bir ders planının iskeletidir."]]}],
nsc:[["Rink'in görev geliştirme basamaklarını bir örnekle açıklar mısınız?","Top sürme için: Bilgilendirme: “Topu yerinde sür.” Genişletme: “Yürürken, sonra zikzak yolda sür.” Arındırma: “Topu parmak uçlarınla it, gözlerin yukarıda olsun.” Uygulama: “Eşinden topu kaptırmadan 30 saniye sür.” Genişletme çeşitliliği, arındırma niteliği artırır."]]},
{h:8,b:"Temel hareket becerileri uygulamaları: Yer değiştirme ve nesne kontrolü",k:[1,6],m:[
"Yer değiştirme ve nesne kontrolü birleştirilerek uygulanır: koşarak topu yakalama, kayarak top sürme, galop yaparken pas verme."],p:[6],sc:[1,6]},
{h:10,b:"Temel hareket becerileri uygulamaları: Dengeleme ve yer değiştirme",k:[8],m:[
"Yer değiştirme ve dengeleme birleştirilerek uygulanır: koşup tek ayakla durma, sekerek iniş yapıp dengede kalma, denge tahtasında yürürken yön değiştirme."],p:[8],sc:[8]},
{h:11,b:"Temel hareket becerileri uygulamaları: Nesne kontrolü ve dengeleme",k:[7],m:[
"Dengeleme ve nesne kontrolü birleştirilerek uygulanır: tek ayak üzerinde dururken top yakalama, denge tahtasında yürürken topu yere vurup tutma."],p:[7],sc:[7]},
{h:12,b:"Temel hareket becerileri uygulamaları: Birleştirilmiş hareket becerileri",m:[
"Birleştirilmiş hareket becerileri, iki ya da daha fazla temel becerinin akıcı biçimde art arda veya aynı anda kullanılmasıdır: koşup sıçrama, top sürüp pas verme, yakalayıp atma.",
"Birleştirmeler spor becerilerinin temelidir: basketbolda turnike (koşma, sekme, sıçrama, atma), voleybolda smaç (koşu, sıçrama, vurma), atletizmde uzun atlama (koşu ve sıçrama).",
"Birleştirmeleri öğretirken önce her beceri ayrı ayrı, sonra yavaş tempoda birlikte, en sonda oyun hızında çalışılır.",
"Akıcılık, zamanlama ve ritim birleştirilmiş becerilerin niteliğini belirler."],k:[9],p:[9],
np:[{t:"Becerileri birleştirmek",d:"Temelden spora köprü",s:[
["H","Basketbolda turnike hangi temel becerilerden oluşur?"],
["Ö","Koşma, top sürme, sıçrama ve atma hocam."],
["H","Evet, aslında sekme de var. İşte birleştirilmiş hareket becerisi budur: iki ya da daha fazla temel becerinin akıcı biçimde arka arkaya kullanılması."],
["Ö","Voleybolda smaç da öyle."],
["H","Doğru: koşu adımları, sıçrama ve vurma. Uzun atlamada da koşu ve sıçrama birleşir. Bu yüzden temel becerileri sağlam olmayan bir öğrenci spor becerilerinde zorlanır."],
["Ö","Birleştirmeleri nasıl öğretmeliyiz?"],
["H","Önce her beceriyi ayrı ayrı, sonra yavaş tempoda birlikte, en sonda oyun hızında. Akıcılık, zamanlama ve ritim birleştirmenin kalitesini belirler. Bu yüzden ritim çalışmaları birleştirilmiş becerilerle çok iyi eşleşir."]]}],sc:[9],
nsc:[["Birleştirilmiş bir beceriyi öğretirken hangi sırayı izlemeliyim?","1) Her temel beceriyi ayrı ayrı çalış. 2) Becerileri yavaş tempoda ve basit koşullarda birleştir (ör. yürüyerek top sürüp durunca pas ver). 3) Hızı ve karmaşıklığı kademeli artır. 4) Rakipli, oyun benzeri durumlarda uygula. Her aşamada akıcılık ve zamanlamayı gözle."]]},
{h:13,b:"Hareket eğitiminde kullanılabilecek farklı öğretim yöntemleri ve teknikleri",k:[11,3],p:[11,3],sc:[11,3]},
{h:14,b:"Hareket eğitiminde yenilikçi yaklaşımlar",k:[10],m:[
"Fiziksel okuryazarlık (Margaret Whitehead): yaşam boyu fiziksel aktiviteye katılım için gereken motivasyon, güven, fiziksel yeterlik, bilgi ve anlayıştır; günümüzde birçok ülkenin beden eğitimi programının temel hedefidir.",
"Teknoloji destekli öğretim: video ile hareket analizi, tabletle geri bildirim, hareket sensörleri ve aktif video oyunları (exergame).",
"Oyunlaştırma, açık hava ve doğa etkinlikleri, disiplinlerarası etkinlikler (hareketle matematik, hareketle dil) öğrenmeyi zenginleştirir.",
"Kapsayıcı ve öğrenci seçimine dayalı yaklaşımlar her öğrencinin kendi düzeyinde başarılı olmasını sağlar."],p:[10],
np:[{t:"Fiziksel okuryazar çocuk",d:"Yenilikçi yaklaşımlar",s:[
["H","Okuma yazma bilmek gibi, hareket etmeyi bilmek de bir okuryazarlık olabilir mi?"],
["Ö","Fiziksel okuryazarlık kavramını kastediyorsunuz hocam."],
["H","Evet, Margaret Whitehead'in geliştirdiği bir kavram. Yaşam boyu aktif kalmak için gereken motivasyon, güven, fiziksel yeterlik, bilgi ve anlayıştır. Sadece beceri değil, isteme ve anlamayı da kapsar."],
["Ö","Teknoloji bu derslere nasıl girebilir?"],
["H","Bir öğrencinin atışını tabletle çekip yavaş çekimde göstermek, çok güçlü bir geri bildirimdir. Hareket sensörleri ve aktif video oyunları da özellikle hareketsiz çocukları harekete çekmek için kullanılabilir."],
["Ö","Oyunlaştırma ve doğa etkinlikleri de yenilikçi yaklaşımlar arasında."],
["H","Evet. Puan, rozet ve görev kartlarıyla ders bir maceraya dönüşebilir. Okul bahçesinde yön bulma, doğa yürüyüşü ya da hareketle matematik gibi disiplinlerarası etkinlikler de öğrenmeyi zenginleştirir."],
["Ö","Ama teknoloji hareket süresini azaltmamalı."],
["H","Çok doğru. Teknoloji bir araçtır; amaç her zaman daha çok ve daha nitelikli hareket olmalıdır."]]}],sc:[10],
nsc:[["Fiziksel okuryazarlık ile spor becerisi aynı şey mi?","Hayır. Spor becerisi belirli bir spor dalındaki teknik yeterliktir. Fiziksel okuryazarlık ise yaşam boyu aktif kalmak için gereken motivasyon, güven, fiziksel yeterlik, bilgi ve anlayışın bütünüdür. Bir öğrenci iyi futbol oynayabilir ama hareket etmeye isteksizse fiziksel okuryazarlığı eksiktir."]]},
{h:15,b:"Hareket eğitiminin gelişimsel aşamaları",k:[2],p:[2],sc:[2]}
]};
