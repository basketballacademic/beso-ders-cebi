sinav:[{h:7,b:"Ders çalışma haftası"},{h:8,b:"Ara sınav haftası"},{h:16,b:"Ders çalışma haftası"},{h:17,b:"Yarıyıl sonu sınavı"}],
weeks:[
{h:1,b:"Eğitimle ilgili temel kavramlar I",k:[0],p:[0],sc:[0]},
{h:2,mf:1,b:"Eğitimle ilgili temel kavramlar II: Eğitimin amaçları, işlevleri ve diğer bilimlerle ilişkisi",m:[
"Eğitimin bireysel işlevi bireyin kişiliğini ve yeteneklerini geliştirmek; toplumsal işlevi kültürü aktarmak ve toplumsal bütünleşmeyi sağlamak; ekonomik işlevi nitelikli iş gücü yetiştirmek; siyasal işlevi demokratik yurttaş yetiştirmektir.",
"Eğitim çok disiplinli bir alandır: psikoloji (öğrenme ve gelişim), sosyoloji (eğitim-toplum ilişkisi), felsefe (amaç ve değerler), ekonomi (kaynak ve getiri), antropoloji (kültür), biyoloji ve tıp (gelişim ve sağlık) ile yakından ilişkilidir.",
"Eğitim programı, öğrenene okulda ve okul dışında planlanmış etkinlikler yoluyla sağlanan öğrenme yaşantılarının bütünüdür; kazanım ise öğrenme süreci sonunda öğrenciden beklenen bilgi, beceri ve tutumdur.",
"Eğitim süreci girdi (öğrenci, öğretmen, kaynak), süreç (öğretme-öğrenme etkinlikleri) ve çıktı (kazanılan davranışlar) öğelerinden oluşan bir sistem olarak düşünülebilir."],k:[1],p:[1],
nsc:[["Eğitimin bireysel ve toplumsal işlevleri arasındaki fark nedir?","Bireysel işlev, kişinin yeteneklerini, kişiliğini ve yaşam becerilerini geliştirmesine yöneliktir. Toplumsal işlev ise kültürün aktarılması, toplumsal bütünleşme, nitelikli iş gücü ve demokratik yurttaş yetiştirilmesi gibi toplumun ihtiyaçlarına yöneliktir. Beden eğitimi her ikisine de hizmet eder: bireyin sağlığını geliştirirken toplumsal değerleri de kazandırır."]]},
{h:3,b:"Eğitimin psikolojik temelleri",k:[5],p:[5],sc:[5]},
{h:4,mf:1,b:"Eğitimin felsefi temelleri ve eğitimin tarihsel gelişimi",m:[
"Antik Yunan'da Sokrates soru sorarak düşündürme yöntemini (doğurtma), Platon Akademia'yı, Aristoteles Lykeion'u kurmuş; eğitim felsefesinin temelleri bu dönemde atılmıştır.",
"Orta Çağ Avrupası'nda eğitim büyük ölçüde kilise ve manastır okullarında, skolastik düşünce çerçevesinde verilmiştir; Rönesans ve Reform ile hümanist ve halka yönelik eğitim anlayışı gelişmiştir.",
"Modern eğitimin öncüleri: Comenius (herkese her şeyi öğretme), Rousseau (doğalcı eğitim, Emile), Pestalozzi (baş-el-kalp eğitimi), Fröbel (ilk anaokulu) ve Dewey (yaparak yaşayarak öğrenme)."],k:[7],p:[7],sc:[7]},
{h:5,b:"Eğitimin toplumsal ve hukuksal temelleri",k:[[6,0,2],3],m:[
"Anayasa'nın 42. maddesine göre kimse eğitim ve öğrenim hakkından yoksun bırakılamaz; ilköğretim kız ve erkek bütün vatandaşlar için zorunludur ve devlet okullarında parasızdır.",
"Eğitimi düzenleyen başlıca yasalar: 1739 sayılı Millî Eğitim Temel Kanunu, 222 sayılı İlköğretim ve Eğitim Kanunu, 2547 sayılı Yükseköğretim Kanunu, 6287 sayılı Kanun (4+4+4) ve 7354 sayılı Öğretmenlik Meslek Kanunu."],p:[3],sc:[3,1]},
{h:6,b:"Eğitimin ekonomik temelleri",k:[[6,2,5]],m:[
"Eğitim ile ekonomik kalkınma arasında karşılıklı bir ilişki vardır: eğitim üretkenliği artırır, gelişen ekonomi de eğitime daha fazla kaynak ayırabilir.",
"Eğitim harcamaları; öğretmen maaşları, okul binaları, araç-gereç ve öğrenci destekleri gibi kalemlerden oluşur; kaynakların etkili ve adil kullanımı eğitim ekonomisinin temel sorusudur.",
"Eğitim ile istihdam arasındaki uyumsuzluk (mezunların becerileri ile iş piyasasının ihtiyaçları arasındaki fark) güncel bir eğitim politikası sorunudur."],p:[6],sc:[6]},
{h:9,mf:1,b:"Türk Millî Eğitim Sisteminin amaçları ve teşkilat yapısı",m:[
"1739 sayılı kanunun genel amaçlarına göre Türk millî eğitimi bireyleri Atatürk ilke ve inkılaplarına bağlı; beden, zihin, ahlak, ruh ve duygu bakımından dengeli ve sağlıklı gelişmiş; hür ve bilimsel düşünme gücüne sahip; ilgi ve yetenekleri doğrultusunda bir meslek sahibi olarak yetiştirmeyi amaçlar.",
"Özel amaçlar, genel amaçlar doğrultusunda her kademe ve okul türü için ayrıca belirlenir.",
"Millî Eğitim Bakanlığı'nın merkez teşkilatında Bakan, bakan yardımcıları, Talim ve Terbiye Kurulu Başkanlığı ve genel müdürlükler yer alır; Talim ve Terbiye Kurulu öğretim programları ve ders kitapları konusunda karar organıdır."],k:[8],p:[8],sc:[8]},
{h:10,b:"Öğretmenlik mesleği: Öğretmenin nitelikleri, görev ve sorumlulukları",k:[4,11],m:[
"MEB Öğretmenlik Mesleği Genel Yeterlikleri (2017) üç alanda tanımlanmıştır: mesleki bilgi, mesleki beceri ve tutum ve değerler.",
"Öğretmenin görevleri arasında öğretim etkinliklerini planlama ve yürütme, ölçme-değerlendirme, rehberlik, okul-aile iş birliği ve mesleki gelişim yer alır."],p:[4,11],sc:[4,11]},
{h:11,b:"21. yüzyılda eğitim bilimlerinde yaklaşımlar, eğitimin teknolojik temelleri ve yeni eğilimler",k:[10],m:[
"21. yüzyıl becerileri: öğrenme ve yenilik becerileri (eleştirel düşünme, yaratıcılık, iletişim, iş birliği), bilgi-medya-teknoloji okuryazarlığı ile yaşam ve kariyer becerileri.",
"Eğitimin teknolojik temelleri: öğretim teknolojileri, dijital içerikler, uzaktan eğitim, harmanlanmış öğrenme (yüz yüze ve çevrim içi birlikte) ve ters yüz sınıf.",
"Yeni eğilimler: yapılandırmacılık, Gardner'ın çoklu zekâ kuramı, bireyselleştirilmiş öğrenme, STEM/STEAM, kapsayıcı eğitim, yaşam boyu öğrenme ve yapay zekâ destekli öğrenme.",
"Türkiye'de 2024'ten itibaren “Türkiye Yüzyılı Maarif Modeli” adıyla yenilenen öğretim programları uygulamaya konmuştur."],p:[10],
np:[{t:"Yarının sınıfı",d:"21. yüzyıl becerileri ve yeni eğilimler",s:[
["H","Bugün öğrencilerinizin çalışacağı mesleklerin bir kısmı henüz yok. Onları neye hazırlamalıyız?"],
["Ö","Sadece bilgiye değil, öğrenmeyi öğrenmeye hocam."],
["H","Çok doğru. 21. yüzyıl becerileri bunu anlatır: eleştirel düşünme, yaratıcılık, iletişim ve iş birliği. Bunlara bilgi, medya ve teknoloji okuryazarlığı ile yaşam ve kariyer becerileri eklenir."],
["Ö","Teknoloji eğitimi nasıl değiştirdi?"],
["H","Uzaktan eğitim, harmanlanmış öğrenme, ters yüz sınıf. Ters yüz sınıfta öğrenci konuyu evde videodan izler, sınıfta uygulama yapar. Beden eğitiminde de bir tekniği önce videodan izleyip derste uygulamak mümkün."],
["Ö","Yapay zekâ da artık eğitimin bir parçası."],
["H","Evet, bireyselleştirilmiş öğrenme için güçlü bir araç olabilir. Ama eleştirel düşünmeyi ve etik kullanımı öğretmek de bizim görevimiz. Çoklu zekâ kuramı, STEM ve kapsayıcı eğitim de yeni eğilimler arasında."],
["Ö","Bedensel-kinestetik zekâ da Gardner'ın zekâ türlerinden biriydi."],
["H","Evet. Bu, hareketin de bir zekâ ve öğrenme biçimi olduğunu hatırlatır. Beden eğitimi öğretmeni olarak bu zekâyı geliştiren uzmanlar sizsiniz."]]}],sc:[10],
nsc:[["Ters yüz sınıf beden eğitiminde nasıl uygulanabilir?","Öğrenciler dersten önce bir becerinin (ör. voleybolda manşet) kısa tanıtım videosunu izler ve temel ipuçlarını öğrenir. Ders saati açıklama yerine uygulama, eşli geri bildirim ve oyuna ayrılır. Böylece aktif hareket süresi artar; öğretmen de bireysel geri bildirime daha çok zaman ayırır."]]},
{h:12,b:"Eğitimin felsefi temelleri: Eğitim felsefeleri",k:[2],p:[2],sc:[2]},
{h:13,b:"Eğitim bilimlerinde araştırma yöntemleri I",k:[9],p:[9],sc:[9]},
{h:14,b:"Eğitim bilimlerinde araştırma yöntemleri II",m:[
"Evren, araştırma sonuçlarının genellenmek istendiği grubun tamamı; örneklem ise evrenden seçilen ve araştırmaya katılan gruptur. Örnekleme yöntemleri olasılıklı (ör. basit rastgele) ve amaçlı olarak ayrılır.",
"Veri toplama araçları: anket, ölçek, test, görüşme formu, gözlem formu ve dokümanlar.",
"Geçerlik, aracın ölçmek istediği özelliği gerçekten ölçmesi; güvenirlik ise ölçme sonuçlarının tutarlı olmasıdır.",
"Deneysel araştırmalarda bağımsız değişkenin (ör. yeni bir öğretim yöntemi) bağımlı değişken (ör. beceri puanı) üzerindeki etkisi, genellikle ön test-son test kontrol gruplu desenle incelenir.",
"Nitel desenler: durum çalışması, olgubilim (fenomenoloji), gömülü kuram ve etnografi. Araştırma raporu giriş, yöntem, bulgular ve tartışma bölümlerinden oluşur; kaynaklar belirli bir yazım kuralına (ör. APA) göre gösterilir."],
np:[{t:"Bir araştırmanın anatomisi",d:"Örneklem, ölçme ve desenler",s:[
["H","Yeni bir öğretim yönteminin beceri gelişimine etkisini araştırmak istiyorsunuz. İlk soru: kimin üzerinde?"],
["Ö","Evren ve örneklemi belirlememiz gerekiyor hocam."],
["H","Doğru. Evren, sonuçları genellemek istediğiniz grubun tamamıdır, örneğin ilçedeki tüm beşinci sınıflar. Örneklem ise araştırmaya katılan gruptur. Rastgele seçerseniz genellenebilirlik artar."],
["Ö","Ölçme araçlarının geçerli ve güvenilir olması gerekiyor."],
["H","Evet. Geçerlik, aracın ölçmek istediğiniz şeyi gerçekten ölçmesidir. Güvenirlik ise tutarlılıktır: aynı öğrenciyi iki kez ölçtüğünüzde benzer sonuç almanız."],
["Ö","Deneysel desen nasıl kurulur?"],
["H","İki grup oluşturursunuz: deney grubu yeni yöntemle, kontrol grubu eski yöntemle çalışır. Her iki gruba da ön test ve son test uygularsınız. Yöntem bağımsız değişken, beceri puanı bağımlı değişkendir."],
["Ö","Nitel araştırmada durum farklı."],
["H","Evet, orada derinlemesine anlamayı amaçlarız: durum çalışması, olgubilim, gömülü kuram. Hangi deseni seçerseniz seçin, raporunuz giriş, yöntem, bulgular ve tartışma bölümlerinden oluşur ve kaynaklarınızı dürüstçe gösterirsiniz."]]}],
nsc:[["Geçerlik ile güvenirlik arasındaki fark nedir?","Geçerlik, ölçme aracının ölçmek istediği özelliği gerçekten ölçüp ölçmediğidir (ör. bir dayanıklılık testi gerçekten dayanıklılığı mı ölçüyor?). Güvenirlik ise ölçme sonuçlarının tutarlılığıdır (aynı koşullarda tekrarlandığında benzer sonuç verir mi?). Güvenilir olmayan bir araç geçerli olamaz; ancak güvenilir bir araç her zaman geçerli olmayabilir."]]},
{h:15,b:"Örnek olayların değerlendirmesi",m:[
"Örnek olay yöntemi, gerçek ya da gerçeğe yakın bir durumun incelenerek sorunun tanımlanması, nedenlerinin analiz edilmesi ve çözüm önerileri geliştirilmesidir.",
"Değerlendirme basamakları: olayı okuma, sorunu tanımlama, ilgili kavram ve kuramları belirleme, alternatif çözümler üretme, en uygun çözümü gerekçesiyle seçme.",
"Örnek olay 1: Öğretmen takımları her zaman kaptanlara seçtiriyor ve aynı öğrenciler hep son seçiliyor. İlgili kavramlar: örtük program, etiketleme, fırsat eşitliği.",
"Örnek olay 2: Bir öğrencinin ailesi ekonomik nedenlerle spor kıyafeti alamıyor ve öğrenci derse katılmıyor. İlgili kavramlar: fırsat ve imkân eşitliği, okul-aile iş birliği.",
"Örnek olay 3: Ders sırasında sürekli konuşan bir öğrenci açıklamaları bölüyor. İlgili kavramlar: önleyici sınıf yönetimi, ben dili, tutarlı kurallar."],
np:[{t:"Vaka masası",d:"Örnek olayları değerlendirmek",s:[
["H","Bugün kuramı sahaya indiriyoruz. İlk vaka: Bir öğretmen takımları her zaman kaptanlara seçtiriyor ve aynı öğrenciler hep son seçiliyor. Sorun ne?"],
["Ö","Bu öğrenciler kendilerini değersiz hissediyor hocam. Bu bir örtük program sorunu."],
["H","Doğru, ayrıca etiketleme ve fırsat eşitliğiyle de ilgili. Çözüm önerin?"],
["Ö","Takımları öğretmen kurabilir ya da rastgele yöntemler kullanılabilir."],
["H","Mükemmel. İkinci vaka: Bir öğrenci ailesi spor kıyafeti alamadığı için derse katılmıyor."],
["Ö","Fırsat ve imkân eşitliği ilkesi. Okul imkânları ya da okul-aile birliği aracılığıyla destek sağlanabilir, öğrenci damgalanmadan."],
["H","Çok iyi, damgalamamak çok önemli. Üçüncü vaka: Bir öğrenci sürekli açıklamaları bölüyor."],
["Ö","Önleyici sınıf yönetimi, net kurallar ve ben dili kullanılabilir."],
["H","Gördüğünüz gibi her vakada aynı basamakları izledik: sorunu tanımla, kavramlarla ilişkilendir, seçenek üret, en iyisini gerekçesiyle seç. Sınavda da bu yolu izleyin."]]}],
nsc:[["Bir örnek olayı sınavda nasıl yanıtlamalıyım?","1) Olaydaki asıl sorunu bir cümleyle tanımla. 2) Sorunu ilgili kavram ve kuramlarla ilişkilendir (ör. örtük program, fırsat eşitliği, sınıf yönetimi). 3) En az iki çözüm seçeneği üret. 4) En uygun çözümü gerekçesiyle seç ve uygulamada nelere dikkat edileceğini belirt."]]}
]};

MU.sos={kod:"SBMB103",akts:"3",
sinav:[{h:8,b:"Ara sınav haftası"}],
weeks:[
{h:1,b:"Eğitim ve sosyolojinin tanımı, konusu ve özellikleri",k:[[0,0,2]],m:[
"Eğitim, bireyin davranışlarında kendi yaşantısı yoluyla kasıtlı olarak istendik değişme meydana getirme sürecidir; sosyolojik açıdan aynı zamanda toplumun kendini yeniden üretmesinin ve değiştirmesinin aracıdır.",
"Sosyolojinin temel kavramları: toplum (ortak bir kültürü paylaşan ve belirli bir toprakta yaşayan insanlar bütünü), toplumsal grup, toplumsal kurum, toplumsal ilişki ve toplumsal yapı.",
"Sosyoloji bilimsel, olgusal, nesnel ve genelleyici bir bilimdir; toplumsal olayları gözlem, görüşme, anket ve istatistik gibi yöntemlerle inceler.",
"Sosyolojik bakış açısı (sosyolojik imgelem), bireysel sorunları toplumsal yapı ve tarihle ilişkilendirerek düşünmeyi sağlar."],p:[0],
nsc:[["Sosyolojik bakış açısı eğitimde neden önemlidir?","Bir öğrencinin başarısızlığını yalnızca bireysel bir sorun olarak değil; aile koşulları, sosyoekonomik durum, okulun olanakları ve toplumsal beklentilerle birlikte görmemizi sağlar. Böylece öğretmen sorunu suçlayarak değil, nedenlerini anlayarak çözmeye çalışır."]]},
{h:2,b:"Eğitim ve sosyoloji: Eğitim sosyolojisi",k:[[0,2,5],6],p:[6],sc:[0,6]},
{h:3,b:"Eğitimde amaçlar ve toplum: Eğitim ile toplumsallaşma",k:[2,5],p:[2,5],sc:[2,5]},
{h:4,b:"Türkiye'de eğitimin tarihsel ve toplumsal dönüşümü",k:[7],m:[
"Osmanlı'da geleneksel eğitim (sıbyan mektepleri, medreseler) Tanzimat'la birlikte Batı tarzı okullarla yan yana var olmuş, eğitimde ikili bir yapı ortaya çıkmıştır.",
"Cumhuriyet döneminde Tevhid-i Tedrisat (1924), Harf İnkılabı (1928), Millet Mektepleri ve Köy Enstitüleri ile eğitim laik, ulusal ve kitlesel bir nitelik kazanmıştır.",
"Kentleşme ve iç göç, okullaşma oranlarının artması ve eğitimin toplumsal hareketlilik aracı olarak görülmesi Türkiye'de eğitimin toplumsal dönüşümünün temel dinamikleridir.",
"1997'de 8 yıllık kesintisiz zorunlu eğitime, 2012'de 12 yıllık zorunlu eğitime (4+4+4) geçilmiştir; kız çocuklarının okullaşmasını artırmaya yönelik kampanyalar da yürütülmüştür."],p:[7],
np:[{t:"Mektepten bugüne",d:"Türkiye'de eğitimin dönüşümü",s:[
["H","Türkiye'de eğitimin dönüşümünü sosyolojik bir gözle okuyalım. Osmanlı'nın son döneminde nasıl bir yapı vardı?"],
["Ö","Bir yanda sıbyan mektepleri ve medreseler, diğer yanda Tanzimat'la açılan Batı tarzı okullar hocam."],
["H","Evet, eğitimde ikili bir yapı. Cumhuriyet bu ikiliği Tevhid-i Tedrisat ile 1924'te sona erdirdi. Ardından Harf İnkılabı, Millet Mektepleri ve Köy Enstitüleri geldi. Eğitim laik, ulusal ve kitlesel hâle geldi."],
["Ö","Toplumsal değişmeyle bağlantısı ne?"],
["H","Kentleşme ve iç göç milyonlarca aileyi şehirlere taşıdı. Eğitim, özellikle alt gelir grupları için yukarı doğru hareketliliğin en önemli yolu olarak görüldü."],
["Ö","Zorunlu eğitim süresi de uzadı."],
["H","1997'de sekiz yıllık kesintisiz eğitime, 2012'de on iki yıllık zorunlu eğitime geçildi. Kız çocuklarının okullaşmasını artırmak için kampanyalar yürütüldü. Bugün tartışma, okula erişimden çok eğitimin niteliğine ve eşitliğine kaymış durumda."]]}],sc:[7],
nsc:[["Eğitimde “ikili yapı” ne demektir?","Tanzimat sonrasında geleneksel okullar (sıbyan mektepleri, medreseler) ile Batı tarzı yeni okulların (rüştiyeler, idadiler, sultaniler) aynı anda var olmasıdır. Bu durum farklı dünya görüşlerine sahip kuşakların yetişmesine yol açmış; Cumhuriyet döneminde Tevhid-i Tedrisat ile eğitim tek çatı altında birleştirilmiştir."]]},
{h:5,b:"Eğitim sosyolojisine Batı'daki ve Türkiye'deki yaklaşımlar",m:[
"Batı'da Comte sosyolojiyi kurmuş, Durkheim eğitimi metodik sosyalleşme olarak ele almış, Weber bürokrasi ve statü gruplarını, Marx ise sınıf çatışmasını incelemiştir; Dewey “Okul ve Toplum” eserinde okulu demokratik toplumun küçük bir modeli olarak görmüştür.",
"Ziya Gökalp hars (millî kültür) ile medeniyet (uluslararası yöntem ve teknik) ayrımını yapmış ve millî eğitim anlayışını savunmuştur; “Türkçülüğün Esasları” (1923) önemli eseridir.",
"Prens Sabahattin, Le Play'den etkilenerek bireysel girişimciliği (teşebbüs-i şahsi) ve yerinden yönetimi (adem-i merkeziyet) savunmuş, bireyi güçlendiren bir eğitim önermiştir.",
"İsmail Hakkı Baltacıoğlu “Talim ve Terbiyede İnkılap” (1912) eseriyle hayata ve işe dayalı bir eğitim anlayışı geliştirmiş; Mümtaz Turhan “Kültür Değişmeleri” (1951) eseriyle kültür değişmesini incelemiştir.",
"Bu yaklaşımlar Türkiye'de eğitimin modernleşme, millî kimlik ve toplumsal kalkınma ile ilişkisi üzerine tartışmaların temelini oluşturur."],
np:[{t:"Gökalp ile Durkheim arasında",d:"Batı'da ve Türkiye'de yaklaşımlar",s:[
["H","Batı'da eğitim sosyolojisine katkı yapan düşünürleri sayalım."],
["Ö","Comte, Durkheim, Weber, Marx hocam. Bir de Dewey."],
["H","Doğru. Durkheim eğitimi metodik sosyalleşme olarak gördü. Dewey ise Okul ve Toplum adlı eserinde okulu demokratik toplumun küçük bir modeli olarak tanımladı."],
["Ö","Türkiye'de ilk akla gelen isim Ziya Gökalp."],
["H","Evet. Gökalp, Durkheim'dan etkilendi ve hars ile medeniyet ayrımını yaptı: hars millî kültürdür, medeniyet ise uluslararası yöntem ve tekniklerdir. Eğitimin harsı korurken medeniyeti alması gerektiğini savundu."],
["Ö","Prens Sabahattin farklı bir yol önermişti."],
["H","Evet, Le Play'den etkilenerek bireysel girişimciliği ve yerinden yönetimi savundu. Ona göre eğitim, bireyi kendi ayakları üzerinde durabilen biri olarak yetiştirmeliydi. İsmail Hakkı Baltacıoğlu ise iş ve hayata dayalı bir okul önerdi; Mümtaz Turhan da kültür değişmelerini inceledi."],
["Ö","Bu tartışmalar bugün de sürüyor mu?"],
["H","Kesinlikle. Eğitimin millî kimlik, modernleşme ve bireysellik arasında nasıl bir denge kuracağı hâlâ tartışılıyor."]]}],
nsc:[["Ziya Gökalp'in hars ve medeniyet ayrımı nedir?","Hars, bir milletin kendine özgü kültürü; dili, değerleri, gelenekleri ve sanatıdır. Medeniyet ise milletler arasında ortak olan bilim, teknik ve yöntemler bütünüdür. Gökalp'e göre eğitim millî harsı korumalı ve geliştirmeli, medeniyeti ise Batı'dan almalıdır."]]},
{h:6,b:"Eğitim sosyolojisi alanında farklı kuramsal yaklaşımlar",k:[1],p:[1],sc:[1]},
{h:7,b:"Eğitim ve demokrasi: Eğitimde fırsat eşit(siz)liği",k:[8],m:[
"Dewey'e göre demokrasi yalnızca bir yönetim biçimi değil, birlikte yaşama biçimidir; okul öğrencilere katılım, tartışma ve iş birliği deneyimi sunarak demokratik yurttaşlık kazandırmalıdır.",
"Fırsat eşitliği demokratik toplumun temel ilkelerindendir; eğitime erişimdeki ve eğitimin niteliğindeki eşitsizlikler demokrasinin işleyişini de zayıflatır."],p:[8],sc:[8]},
{h:9,b:"Eğitim, toplumsal yapı, toplumsal tabakalaşma ve toplumsal sınıflar",k:[[3,0,3]],m:[
"Tabakalaşma sistemleri: kast sistemi (doğuşla belirlenen, kapalı), zümre (feodal) sistemi ve sınıf sistemi (görece açık, hareketliliğe izin veren).",
"Marx'a göre toplumsal sınıflar üretim araçlarına sahip olup olmama ile belirlenir (burjuvazi ve proletarya); Weber ise tabakalaşmayı sınıf (ekonomik durum), statü (saygınlık) ve parti (güç) boyutlarıyla açıklar.",
"Toplumsal sınıf; gelir, meslek, eğitim düzeyi ve yaşam tarzı gibi göstergelerle ölçülür ve çocukların eğitim olanaklarını, beklentilerini ve başarılarını etkiler."],
np:[{t:"Katmanlı toplum",d:"Tabakalaşma ve sınıf",s:[
["H","Toplumu katmanlara ayıran sistemler nelerdir?"],
["Ö","Kast, zümre ve sınıf sistemleri hocam."],
["H","Doğru. Kast sistemi doğuşla belirlenir ve kapalıdır, bir kasttan diğerine geçmek neredeyse imkânsızdır. Zümre sistemi feodal toplumlarda görülür. Sınıf sistemi ise görece açıktır ve bireylerin konum değiştirmesine izin verir."],
["Ö","Marx ve Weber sınıfı farklı açıklıyordu."],
["H","Evet. Marx'a göre sınıfı belirleyen üretim araçlarına sahip olup olmamaktır: burjuvazi ve proletarya. Weber ise üç boyuttan söz eder: ekonomik durumu ifade eden sınıf, saygınlığı ifade eden statü ve gücü ifade eden parti."],
["Ö","Bunun eğitimle ilişkisi ne?"],
["H","Toplumsal sınıf; gelir, meslek, eğitim düzeyi ve yaşam tarzıyla ölçülür ve çocuğun okula hangi olanaklarla geldiğini belirler. Okul bu farkları azaltabilir de, yeniden üretebilir de. Hangi yönde çalışacağı biraz da öğretmenlerin elindedir."]]}],sc:[3]},
{h:10,b:"Eğitim ve toplumsal cinsiyet",k:[9],p:[9],sc:[9]},
{h:11,b:"Eğitim ve göç",k:[11],m:[
"Göç türleri: iç göç (ör. kırdan kente) ve dış (uluslararası) göç; gönüllü ve zorunlu göç.",
"Türkiye hem yoğun iç göç yaşamış hem de son yıllarda çok sayıda uluslararası göçmen ve geçici koruma altındaki çocuğu eğitim sistemine katmıştır.",
"Göçmen öğrencilerin başlıca sorunları: dil engeli, uyum güçlüğü, ekonomik yoksunluk, ayrımcılık ve okula devamsızlık; dil desteği, uyum programları ve rehberlik bu sorunları azaltır.",
"Irkçılık ve ayrımcılık karşıtı pedagoji, sınıfta önyargıları fark etmeyi ve farklılıklara saygıyı öğretmeyi amaçlar."],p:[11],sc:[11]},
{h:12,b:"Eğitim ve toplumsal hareketlilik",k:[[3,3,4]],m:[
"Eğitim modern toplumlarda yukarı doğru dikey hareketliliğin en önemli kanalı olarak görülür; diploma ve beceriler daha iyi mesleklere erişimi sağlar.",
"Meritokrasi (liyakat düzeni), bireylerin konumunun yetenek ve çabaya göre belirlenmesini öngörür; eleştirmenler ise başlangıç eşitsizliklerinin bu düzeni zayıflattığını vurgular.",
"Yapısal hareketlilik, ekonomik yapının değişmesi (tarımdan sanayi ve hizmet sektörüne geçiş gibi) sonucunda pek çok kişinin konumunun birlikte değişmesidir.",
"Kuşaklar arası hareketlilik çalışmaları, ebeveyn eğitim düzeyinin çocukların eğitim ve meslek konumunu güçlü biçimde etkilediğini göstermektedir."],p:[3],
nsc:[["Meritokrasi neden eleştirilir?","Meritokrasi bireylerin yetenek ve çabaya göre ödüllendirilmesini savunur. Ancak eleştirmenlere göre çocuklar yarışa eşit koşullarda başlamaz: aile geliri, kültürel sermaye, özel ders imkânı ve okulun niteliği başarıyı etkiler. Bu durumda “liyakat” olarak görülen şey, kısmen ailenin avantajlarının yeniden üretilmesi olabilir."]]},
{h:13,b:"Eğitimde alternatif yaklaşımlar: Paulo Freire'nin eleştirel pedagojisi ve Pierre Bourdieu'nün temel kavramları",m:[
"Brezilyalı eğitimci Paulo Freire “Ezilenlerin Pedagojisi” (1968) adlı eserinde öğretmenin bilgiyi öğrencinin zihnine “yatırdığı” bankacı eğitim modelini eleştirmiştir.",
"Freire'nin önerdiği problem tanımlayıcı eğitimde öğretmen ve öğrenci diyalog içinde birlikte öğrenir; amaç bilinçlendirme, yani bireyin kendi koşullarını eleştirel biçimde kavrayıp dönüştürebilmesidir.",
"Freire'ye göre praksis, düşünme ile eylemin birlikte yürümesidir; eğitim hiçbir zaman tarafsız değildir.",
"Bourdieu'ye göre sermaye türleri ekonomik, kültürel, sosyal ve simgesel sermayedir; kültürel sermaye bedenselleşmiş (alışkanlıklar), nesneleşmiş (kitaplar, eserler) ve kurumsallaşmış (diplomalar) biçimlerde bulunur.",
"Bourdieu'nün habitus (kalıcı eğilimler), alan (mücadele alanı) ve simgesel şiddet (egemen kültürün doğal ve meşru gösterilmesi) kavramları, Passeron ile birlikte yazdığı “Yeniden Üretim” (1970) eserinde okulun eşitsizlikleri nasıl yeniden ürettiğini açıklar."],
np:[{t:"Bankadan diyaloğa",d:"Freire ve Bourdieu",s:[
["H","Paulo Freire eğitimi bir bankaya benzetir. Neden?"],
["Ö","Öğretmen bilgiyi öğrencinin zihnine para yatırır gibi yatırıyor, öğrenci de sadece depoluyor hocam."],
["H","Tam olarak. Freire buna bankacı eğitim der ve eleştirir. Önerisi problem tanımlayıcı eğitimdir: öğretmen ve öğrenci diyalog içinde birlikte öğrenir. Amaç bilinçlendirmedir, yani kişinin kendi koşullarını eleştirel olarak kavrayıp dönüştürebilmesi."],
["Ö","Praksis kavramı da vardı."],
["H","Evet, düşünme ile eylemin birlikte yürümesi. Freire'ye göre eğitim asla tarafsız değildir; ya mevcut düzeni sürdürür ya da özgürleştirir."],
["Ö","Bourdieu de okulun eşitsizlikleri yeniden ürettiğini söylüyordu."],
["H","Evet. Bourdieu dört sermaye türünden söz eder: ekonomik, kültürel, sosyal ve simgesel. Kültürel sermaye bedenselleşmiş, nesneleşmiş ve kurumsallaşmış biçimlerde bulunur. Habitus, kalıcı eğilimlerimizdir. Simgesel şiddet ise egemen kültürün doğal ve meşru gibi gösterilmesidir."],
["Ö","Bu iki düşünür bize ne söylüyor?"],
["H","Sınıfta neyi, nasıl ve kimin diliyle öğrettiğimizin masum olmadığını. Diyaloğa açık, her öğrencinin deneyimine değer veren bir öğretmen olmak, ikisinin de ortak mesajıdır."]]}],
nsc:[["Bankacı eğitim modeli beden eğitimi dersinde nasıl görünür?","Öğretmenin her hareketi tek doğru biçimde gösterip öğrencilerden yalnızca aynen tekrar etmelerini beklediği, öğrencilere soru sorma, seçim yapma ve kendi çözümlerini üretme fırsatı vermediği dersler bankacı modele yakındır. Freire'nin önerisine uygun bir ders ise öğrencilere problemler sunar, onların fikirlerini dinler ve birlikte karar alır."]]},
{h:14,b:"Eğitim sosyolojisinde güncel tartışmalar",k:[4,10],m:[
"Gölge eğitim (özel ders ve kurslar) ve sınav odaklı rekabet, ailelerin ekonomik gücüne göre eşitsizlikleri artırabilir.",
"Dijitalleşme, yapay zekâ ve ekran kullanımı öğrenme alışkanlıklarını, okulun rolünü ve öğretmen-öğrenci ilişkisini dönüştürmektedir.",
"Okul terki, akran zorbalığı, okulda şiddet ve öğrenci iyi oluşu eğitim sosyolojisinin güncel gündem maddeleridir."],p:[4,10],sc:[4,10]},
{h:15,b:"Eğitim sosyolojisinde yeni bir yaklaşım: 21. yüzyıl becerileri ve çocuk üniversiteleri",m:[
"21. yüzyıl becerileri çerçevesi öğrenme ve yenilik becerilerini (eleştirel düşünme, yaratıcılık, iletişim, iş birliği), bilgi-medya-teknoloji becerilerini ve yaşam-kariyer becerilerini kapsar.",
"Eğitim sosyolojisi açısından bu becerilerin kazanılmasında ailenin kültürel sermayesi ve okulun olanakları belirleyicidir; dezavantajlı çocuklar için okul bu becerilere erişimin temel kaynağıdır.",
"Çocuk üniversiteleri, çocukları üniversite ortamıyla ve bilimsel düşünceyle erken yaşta tanıştıran programlardır; ilk örneklerinden biri 2002'de Almanya'da Tübingen Üniversitesi'nde başlamıştır.",
"Türkiye'de de birçok üniversite çocuk üniversitesi programları düzenlemektedir; bu programlar merakı, bilimsel düşünmeyi ve üniversiteye yönelik farkındalığı artırmayı amaçlar.",
"Çocuk üniversitelerine erişimin tüm toplumsal kesimlere eşit biçimde açılması, fırsat eşitliği açısından önemli bir tartışma konusudur."],
np:[{t:"Üniversite kapısında çocuklar",d:"21. yüzyıl becerileri ve çocuk üniversiteleri",s:[
["H","Dersi geleceğe bakarak bitirelim. 21. yüzyıl becerileri nelerdir?"],
["Ö","Eleştirel düşünme, yaratıcılık, iletişim ve iş birliği hocam."],
["H","Evet, bunlara öğrenme ve yenilik becerileri denir. Ayrıca bilgi, medya ve teknoloji becerileri ile yaşam ve kariyer becerileri de bu çerçevededir."],
["Ö","Bu becerilerin sosyolojiyle ne ilgisi var?"],
["H","Çok ilgisi var. Bu becerileri kazanma fırsatı herkese eşit dağılmıyor. Kitapların, atölyelerin, müzelerin ve kursların olduğu bir ortamda büyüyen çocuk avantajlıdır. Dezavantajlı çocuk için bu fırsatların temel kaynağı okuldur."],
["Ö","Çocuk üniversiteleri de bu tartışmanın içinde."],
["H","Evet. Çocukları erken yaşta üniversite ve bilimle tanıştıran programlardır. İlk örneklerden biri 2002'de Almanya'da Tübingen'de başladı, Türkiye'de de birçok üniversite bu programları düzenliyor."],
["Ö","Ama her çocuk katılabiliyor mu?"],
["H","İşte kritik soru bu. Eğer yalnızca bilinçli ve imkânı olan aileler katılırsa, iyi niyetli bir program bile eşitsizliği büyütebilir. Eğitim sosyolojisi bize her yeniliğe “kimin için?” sorusuyla bakmayı öğretir."]]}],
nsc:[["Çocuk üniversiteleri eşitsizliği azaltır mı, artırır mı?","Program tasarımına bağlıdır. Erişim yalnızca bilgisi ve imkânı olan ailelere açık kalırsa, kültürel sermayesi yüksek çocukların avantajını artırabilir. Okullarla iş birliği yapılarak dezavantajlı bölgelerden öğrencilerin ücretsiz katılımı sağlanırsa, bilimle tanışma fırsatını eşitleyen güçlü bir araç olabilir."]]}
]};

function course(){
  const c=C(view.id),tab=view.tab||"hafta";const p=prog(c);

  if(tab==="hafta"){const cur=sp.key==="hafta:"+c.id&&sp.marks&&sp.marks[sp.i]?sp.marks[sp.i][1]:-1;renderedWeek=cur;const r=courseAll(c,true);const starts=c.konular.map((_,i)=>r.marks.findIndex(m=>m[1]===i));const pos=S.pos["hafta:"+c.id];
    body=P+`<div class="btns"><button class="btn" data-pl="hafta" data-st="0">▶ Tüm haftaları kesintisiz dinle</button>${dlBtn([c.id])}${pos&&r.marks[pos]?`<button class="btn alt" data-pl="hafta" data-st="${pos}">Kaldığın yerden devam · Hafta ${c.konular[r.marks[pos][1]].h}</button>`:""}</div><p class="muted">Haftalar Marmara Üniversitesi ders bilgi paketindeki (${c.kod}) haftalık konulara göre düzenlenmiştir. Her hafta sırasıyla konu anlatımı, podcast ve soru-cevaplardan oluşur; bir hafta bitince sonraki hafta kendiliğinden başlar. Kaldığın yer bu cihazda hatırlanır.${AUD?" Ses dosyası olarak çalar: ekran kapalıyken ve başka uygulamaya geçtiğinde de devam eder; kilit ekranından duraklatıp haftalar arasında geçebilirsin.":""}</p>`+[...c.konular.map((k,i)=>({h:k.h,i})),...(c.sinav||[]).map(x=>({h:x.h,s:x}))].sort((a,b)=>a.h-b.h).map(o=>{if(o.s)return `<div class="card exam-wk"><div class="qhead"><span class="chip">Hafta ${o.s.h}</span></div><h3 style="margin-top:8px">${esc(o.s.b)}</h3><p class="muted" style="margin:6px 0 0">Bu hafta yeni konu yok. Önceki haftaları tekrar et ve deneme sınavı çöz.</p><div class="btns" style="margin-bottom:0"><button class="mini" data-cexam="${c.id}">Bu dersin denemesini çöz</button></div></div>`;const i=o.i,k=c.konular[i];const ps=c.podcast.filter(x=>x.k===i),q=c.sc.filter(x=>x[2]===i);const A=AUD&&AUD[c.id];const mins=A?Math.max(1,Math.round(((i<c.konular.length-1?A.t[starts[i+1]]:A.d)-A.t[i?starts[i]:0])/60)):Math.max(1,Math.round(weekLines(c,i).reduce((a,l)=>a+l[1].split(" ").length,0)/130));return `<div class="card week${i===cur?" now":""}" id="w${i}"><div class="qhead"><span class="chip">Hafta ${k.h} · ~${mins} dk</span><button class="mini" data-pl="hafta" data-st="${starts[i]}" aria-label="Hafta ${k.h}'den dinle">▶ Buradan dinle</button></div><h3 style="margin-top:8px">${esc(k.b)}</h3><ol class="parts"><li>Konu anlatımı · ${k.m.length} madde</li>${ps.map(p=>`<li>Podcast · ${esc(p.t)}</li>`).join("")}${q.length?`<li>Soru-cevap · ${q.length} soru</li>`:""}</ol>${i===cur?`<div class="wk">${r.lines.map((l,j)=>r.marks[j][1]===i?`<div class="line seek" data-l="hafta:${c.id}|${j}"><span class="av ${l[0]==="H"?"h":""}">${l[0]==="N"?"A":l[0]}</span><div><b>${NM[l[0]]}:</b> ${esc(l[1])}</div></div>`:"").join("")}</div>`:""}</div>`}).join("")+`<p class="muted">Kaynak: <a href="https://meobs.marmara.edu.tr/ProgramTanitim/spor-bilimleri-fakultesi/beden-egitimi-ve-spor-ogretmenligi-1093-807-0">MÜ Beden Eğitimi ve Spor Öğretmenliği müfredatı</a> · ${esc(c.kod)} · ${esc(c.akts)} AKTS</p>`}
  if(tab==="konu"){let g=0;body=P+`<div class="btns"><button class="btn" data-pl="konu" data-st="0">▶ Tüm konuları dinle</button></div><p class="muted">Bir maddeye dokunarak oradan dinlemeye başlayabilirsin.${AUD&&AUD[c.id]?" Ses dosyası olarak çalar; ekran kapalıyken de devam eder.":" Ekran kilitlenince bazı telefonlarda okuma durabilir."}</p><div class="toc">${c.konular.map((k,i)=>`<button class="mini" data-jump="${i}">${k.h}. ${esc(k.b)}</button>`).join("")}</div>`+c.konular.map((k,i)=>{const t=g++;return `<div class="card topic" id="t${i}"><div class="qhead"><span class="chip">Hafta ${k.h}</span><button class="mini" data-pl="konu" data-st="${t}" aria-label="Hafta ${k.h} konusunu dinle">▶ Dinle</button></div><h3 class="seek" style="margin-top:8px" data-l="konu:${c.id}|${t}">${esc(k.b)}</h3><ul>${k.m.map(m=>`<li class="seek" data-l="konu:${c.id}|${g++}">${esc(m)}</li>`).join("")}</ul></div>`}).join("")}

  if(tab==="sc")body=P+`<div class="btns"><button class="btn" data-pl="sc" data-st="0">▶ Tüm soru-cevapları dinle</button></div><p class="muted">Öğrencilerin sık sorduğu sorular ve hocanın cevapları. Kendi sorunu “Sorularım” bölümüne not edip derste sorabilirsin.${AUD&&AUD[c.id]?" Dinlerken ekran kapalıyken de devam eder.":""}</p>`+c.sc.map((q,i)=>`<details class="qa"><summary data-l="sc:${c.id}|${i*2}"><span class="av">Ö</span><span>${esc(q[0])}</span></summary><div class="ans" data-l="sc:${c.id}|${i*2+1}"><span class="av h">H</span><div>${esc(q[1])}<div><button class="mini" data-pl="sc" data-st="${i*2}">▶ Dinle</button></div></div></div></details>`).join("")+`<button class="btn alt" data-go2="mine" data-cid="${c.id}">Hocaya soracağım soruyu not al</button>`;
  if(tab==="test"){const w=c.test.filter((_,i)=>S.r[c.id+":"+i]===0).length;const nb=c.test.filter(t=>t[3]==="bd").length;body=`<div class="card"><h3>${c.test.length} soru · 5 şık</h3><p>${c.test.length-nb} çoktan seçmeli ve ${nb} şıklı boşluk doldurma sorusu. Her cevaptan sonra doğru şık ve açıklama gösterilir; şıkların sırası her denemede karışır.</p><p class="muted">Şu ana kadar ${p.done} soru çözdün, ${p.ok} doğru.</p><div class="btns"><button class="btn" data-start="all">Tümünü çöz (${c.test.length})</button><button class="btn alt" data-start="mc">Çoktan seçmeli (${c.test.length-nb})</button><button class="btn alt" data-start="bd">Boşluk doldurma (${nb})</button>${w?`<button class="btn alt" data-start="wrong">Sadece yanlışlarım (${w})</button>`:""}</div></div>`}
  return header(c.ad,`${c.kod?c.kod+" · ":""}%${p.p} tamamlandı`,true)+`<div class="tabs" role="tablist">${T.map(t=>`<button role="tab" aria-selected="${t[0]===tab}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="wrap">${body}</div>`;
}

const au=new Audio();au.preload="auto";let curAid=null,pend=false,pendT=0;sp.map=null;const idxOf=new Map();

function audPlay(i){const[aid,li]=sp.map[i],A=AUD[aid];pend=true;clearTimeout(pendT);pendT=setTimeout(()=>{pend=false},2500);
  const go=()=>{try{au.currentTime=A.t[li]||0}catch(e){}au.playbackRate=sp.rate;au.play().catch(()=>{sp.on=false;uiSp();toast("Oynatmak için ▶ düğmesine dokun")})};
  if(curAid!==aid){curAid=aid;au.src=A.f;au.addEventListener("loadedmetadata",go,{once:true});au.load()}else go();
  sp.i=i;sp.on=true;S.pos[sp.key]=i;save();uiSp();mediaMeta()}
function audFinish(){au.pause();sp.on=false;delete S.pos[sp.key];save();sp.i=0;uiSp();toast("Bitti")}
function audNext(){if(sp.i+1<sp.map.length)audPlay(sp.i+1);else audFinish()}
au.addEventListener("seeked",()=>{pend=false});

function makeQ(cid,i){const t=C(cid).test[i];const o=shuffle(t[1].map((x,k)=>({x,k})));return{cid,i,q:t[0],opts:o.map(z=>z.x),ans:o.findIndex(z=>z.k===0),exp:t[2],bd:t[3]==="bd",pick:null}}

  <label for="mt" class="muted">Sorun</label><textarea id="mt" style="margin-top:6px" placeholder="Ör. Eksantrik kasılmada kas neden daha fazla kuvvet üretebiliyor?"></textarea><div class="btns"><button class="btn" data-addq="1">Kaydet</button></div><p class="muted" style="margin:0">Sorular bu cihazda saklanır. Derste ya da ofis saatinde hocana sorduktan sonra cevabını not alabilirsin.</p></div>
  ${S.mine.length?S.mine.map((m,i)=>`<div class="card"><div class="qhead"><span class="chip">${esc((C(m.c)||{kisa:""}).kisa)}</span><span class="muted">${esc(new Date(m.t).toLocaleDateString("tr-TR"))}</span></div><p><b>${esc(m.q)}</b></p><textarea data-ans="${i}" placeholder="Hocanın cevabını buraya yaz">${esc(m.a||"")}</textarea><div class="btns"><button class="btn alt" data-copy="${i}">Kopyala</button><button class="btn alt" data-del="${i}">Sil</button></div></div>`).join(""):`<p class="muted">Henüz kayıtlı soru yok.</p>`}</div>`}

function search(){const term=(view.t||"").trim();const lo=term.toLocaleLowerCase("tr");const hl=s=>{const e=esc(s);if(!term)return e;const i=s.toLocaleLowerCase("tr").indexOf(lo);if(i<0)return e;return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+term.length))+"</mark>"+esc(s.slice(i+term.length))};
  const res=[];if(lo.length>1)COURSES.forEach(c=>{c.konular.forEach(k=>k.m.forEach(m=>{if(m.toLocaleLowerCase("tr").includes(lo))res.push({c,k:"Konu · "+k.b,s:m,go:{tab:"konu"}})}));c.sc.forEach(q=>{if((q[0]+q[1]).toLocaleLowerCase("tr").includes(lo))res.push({c,k:"Soru-Cevap",s:q[0],go:{tab:"sc"}})});c.podcast.forEach((e,i)=>{if(e.s.some(l=>l[1].toLocaleLowerCase("tr").includes(lo)))res.push({c,k:"Podcast",s:e.t,go:{tab:"pod",ep:i}})});c.test.forEach(t=>{if((t[0]+t[1][0]).toLocaleLowerCase("tr").includes(lo))res.push({c,k:"Test sorusu",s:t[0],go:{tab:"test"}})})});
  search.res=res;
  return header("Arama",res.length+" sonuç",true)+`<div class="wrap"><input type="search" id="q" value="${esc(term)}" aria-label="Ara"><div class="sec">${res.slice(0,60).map((r,i)=>`<button class="card" data-res="${i}"><span class="chip">${esc(r.c.kisa)} · ${esc(r.k)}</span><p>${hl(r.s)}</p></button>`).join("")||'<p class="muted">Sonuç yok. Başka bir kavram dene.</p>'}</div></div>`}

function bind(){
  app.querySelectorAll("[data-act=back]").forEach(b=>b.onclick=()=>{if(view.name==="quizView"&&quiz&&quiz.mode==="exam"&&quiz.pos<quiz.list.length){finishQuiz();render();return}if(view.name==="quizView"&&quiz&&quiz.from)nav("course",quiz.from);else if(view.name==="quizView")nav(quiz&&quiz.mode==="exam"?"exam":"home");else nav("home")});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>nav("course",{id:b.dataset.open,tab:"hafta"}));
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>nav(b.dataset.go2,b.dataset.cid?{cid:b.dataset.cid}:{}));
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(!isAud())stopSpeech();view.tab=b.dataset.tab;delete view.ep;render()});
  app.querySelectorAll("[data-daily]").forEach(b=>b.onclick=()=>{const[c,i]=b.dataset.daily.split(":");startQuiz([makeQ(c,+i)],"test","Günün sorusu")});
  const qi=$("#q");if(qi){qi.addEventListener("keydown",e=>{if(e.key==="Enter"){nav("search",{t:qi.value})}});qi.addEventListener("search",()=>{if(qi.value)nav("search",{t:qi.value})});if(view.name==="search"){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}}
  app.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{const r=search.res[+b.dataset.res];nav("course",Object.assign({id:r.c.id},r.go))});
  app.querySelectorAll("[data-dl]").forEach(b=>{const ids=b.dataset.dl.split(",");dlState(ids).then(n=>{if(n===ids.length){b.textContent="✓ Sesler çevrimdışı hazır";b.disabled=true}});b.onclick=()=>dlAudio(ids,b)});
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const t=document.getElementById("t"+b.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  app.querySelectorAll("[data-pl]").forEach(b=>b.onclick=e=>{e.stopPropagation();startPl(b.dataset.pl,+(b.dataset.ep||0),+(b.dataset.st||0))});
  app.querySelectorAll(".seek[data-l]").forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.l.split("|");const pr=k.split(":");startPl(pr[0],+(pr[2]||0),+i)});
  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const a=b.dataset.pc,n=sp.lines.length;if(a==="toggle"){if(sp.on){stopSpeech();uiSp()}else if(isAud()&&curAid&&au.currentSrc)au.play().catch(()=>{});else speakFrom(sp.i)}if(a==="next")speakFrom(Math.min(sp.i+1,n-1));if(a==="prev")speakFrom(Math.max(0,sp.i-1));if(a==="rate"){sp.rate=sp.rate===1?1.25:sp.rate===1.25?1.5:sp.rate===1.5?0.85:1;if(isAud()){au.playbackRate=sp.rate;uiSp()}else if(sp.on)speakFrom(sp.i);else uiSp()}if(a==="close"){stopSpeech();sp.key=null;sp.map=null;curAid=null;try{au.removeAttribute("src");au.load()}catch(e){}render()}});
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const c=C(view.id);let idx=c.test.map((_,i)=>i);const st=b.dataset.start;if(st==="wrong")idx=idx.filter(i=>S.r[c.id+":"+i]===0);if(st==="bd")idx=idx.filter(i=>c.test[i][3]==="bd");if(st==="mc")idx=idx.filter(i=>c.test[i][3]!=="bd");startQuiz(shuffle(idx).map(i=>makeQ(c.id,i)),"test",c.kisa+(st==="bd"?" · boşluk doldurma":" testi"));quiz.from={id:c.id,tab:"test"}});
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const q=quiz.list[quiz.pos];if(q.pick!==null)return;q.pick=+b.dataset.pick;S.r[q.cid+":"+q.i]=q.pick===q.ans?1:0;save();render()});
  app.querySelectorAll("[data-qnav]").forEach(b=>b.onclick=()=>{stopSpeech();if(quiz.pos===quiz.list.length-1){if(quiz.mode==="exam")finishQuiz();else quiz.pos++}else quiz.pos++;render();window.scrollTo(0,0)});
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{const q=quiz.list[quiz.pos];if(q.pick===null)sayOnce(q.q.replace(/____/g," boşluk ")+". "+q.opts.map((o,k)=>LET[k]+" şıkkı: "+o).join(". "));else sayOnce((q.pick===q.ans?"Doğru. ":"Yanlış. Doğru cevap "+LET[q.ans]+" şıkkı: "+q.opts[q.ans]+". ")+q.exp)});
  app.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>{const z=quiz;startQuiz(shuffle(z.list.map(q=>makeQ(q.cid,q.i))),z.mode,z.title);quiz.limit=z.limit;quiz.from=z.from;if(z.mode==="exam")runTimer()});
  app.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{const bd=b.dataset.exam==="bd20";const n=bd?20:+b.dataset.exam;const pool=shuffle(COURSES.flatMap(c=>c.test.map((t,i)=>[c.id,i,t[3]==="bd"])).filter(p=>!bd||p[2])).slice(0,n);startQuiz(pool.map(p=>makeQ(p[0],p[1])),"exam",bd?"Boşluk doldurma denemesi":n+" soruluk deneme");quiz.limit=(bd?20:n===25?30:n===50?60:12)*60000;runTimer()});
  app.querySelectorAll("[data-cexam]").forEach(b=>b.onclick=()=>{const c=C(b.dataset.cexam);startQuiz(shuffle(c.test.map((_,i)=>makeQ(c.id,i))).slice(0,30),"exam",c.kisa+" denemesi");quiz.limit=36*60000;runTimer()});
  app.querySelectorAll("[data-wrongq]").forEach(b=>b.onclick=()=>{const it=Object.entries(S.r).filter(([k,v])=>v===0).map(([k])=>k.split(":")).filter(x=>C(x[0])&&C(x[0]).test[+x[1]]);startQuiz(shuffle(it).map(x=>makeQ(x[0],+x[1])),"test","Yanlışlarım")});
  app.querySelectorAll("[data-addq]").forEach(b=>b.onclick=()=>{const t=$("#mt").value.trim();if(!t){toast("Önce sorunu yaz");return}S.mine.unshift({c:$("#mc").value,q:t,a:"",t:Date.now()});save();view.cid=$("#mc").value;render();toast("Soru kaydedildi")});
  app.querySelectorAll("[data-ans]").forEach(t=>t.oninput=()=>{S.mine[+t.dataset.ans].a=t.value;save()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(b.dataset.sure){S.mine.splice(i,1);save();render();toast("Silindi")}else{b.dataset.sure=1;b.textContent="Emin misin? Sil"}});
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const m=S.mine[+b.dataset.copy];const txt=(C(m.c)||{ad:""}).ad+" – "+m.q;try{await navigator.clipboard.writeText(txt);toast("Kopyalandı")}catch(e){toast("Kopyalanamadı")}});
}

function runTimer(){clearInterval(timer);timer=setInterval(()=>{if(!quiz||view.name!=="quizView"){clearInterval(timer);return}const left=quiz.limit-(Date.now()-quiz.start);const el=$("#tm");if(el)el.textContent=fmt(Math.max(0,left));if(left<=0&&quiz.pos<quiz.list.length){finishQuiz();toast("Süre doldu");render()}},500)}

const onl=()=>{$("#off").style.display=navigator.onLine?"none":"block"};window.addEventListener("online",onl);window.addEventListener("offline",onl);onl();
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
