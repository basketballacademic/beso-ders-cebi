id:"egt", kisa:"Eğitime Giriş", ad:"Eğitime Giriş", renk:"#6a4c93",
konular:[
{b:"Temel kavramlar", m:[
"Eğitim (Ertürk): Bireyin davranışlarında kendi yaşantısı yoluyla kasıtlı olarak istendik değişme meydana getirme sürecidir.",
"Öğrenme: Yaşantı ürünü, kalıcı izli davranış değişikliğidir. Öğretme: Öğrenmeyi sağlamaya yönelik rehberlik etkinlikleridir. Öğretim: Öğrenmenin planlı ve kontrollü biçimde okulda gerçekleştirilmesidir.",
"Kasıtlı (formal) eğitim planlı ve amaçlıdır; kasıtsız (informal) eğitim gelişigüzel, plansızdır (ör. akran ve medya etkisi).",
"Örgün eğitim belirli yaş grubuna, okul çatısı altında, programlı olarak verilir; yaygın eğitim örgün eğitime hiç girmemiş ya da ayrılmış bireylere yöneliktir (halk eğitim merkezleri, kurslar).",
"Program türleri: resmî program, örtük (gizli) program ve dışta bırakılan (null) program."]},
{b:"Eğitimin temelleri", m:[
"Felsefi temeller: Eğitimin amaçlarını, değerleri ve “nasıl bir insan?” sorusunu belirler.",
"Psikolojik temeller: Gelişim ve öğrenme ilkeleri, bireysel farklılıklar, motivasyon.",
"Sosyolojik temeller: Eğitim ile toplum, kültür, aile ve toplumsal değişme ilişkisi.",
"Tarihî, ekonomik ve hukuki (yasal) temeller: Eğitimin geçmişi, insan sermayesi ve yatırım boyutu, eğitimi düzenleyen anayasa ve yasalar."]},
{b:"Eğitim felsefeleri", m:[
"Daimicilik (perennializm): Değişmeyen evrensel doğrular, klasik eserler, akıl eğitimi; idealizm ve realizme dayanır.",
"Esasicilik (esansiyalizm): Kültürün temel bilgi ve becerilerini aktarma, öğretmen merkezli, disiplin ve temel dersler.",
"İlerlemecilik (progresivizm): John Dewey; pragmatizme dayanır, öğrenci merkezli, yaparak-yaşayarak öğrenme, problem çözme.",
"Yeniden kurmacılık (rekonstrüksiyonizm): Theodore Brameld; okul toplumu değiştirme ve yeniden yapılandırma aracıdır.",
"Varoluşçu eğitim: Bireysel seçim, özgürlük ve sorumluluk; öğrencinin kendini gerçekleştirmesi.",
"Felsefi akımlar: idealizm (Platon), realizm (Aristoteles), pragmatizm (Peirce, James, Dewey), varoluşçuluk (Sartre)."]},
{b:"Türk eğitim sistemi", m:[
"1739 sayılı Millî Eğitim Temel Kanunu (1973) Türk millî eğitiminin genel amaçlarını ve temel ilkelerini belirler.",
"Temel ilkelerden bazıları: genellik ve eşitlik, ferdin ve toplumun ihtiyaçları, yöneltme, eğitim hakkı, fırsat ve imkân eşitliği, süreklilik, demokrasi eğitimi, laiklik, bilimsellik, planlılık, karma eğitim, okul ile ailenin iş birliği, her yerde eğitim.",
"Tevhid-i Tedrisat Kanunu (3 Mart 1924) tüm eğitim kurumlarını Maarif Vekâletine bağlayarak öğretimi birleştirmiştir.",
"2012'de 6287 sayılı Kanun ile 12 yıllık zorunlu eğitim (4+4+4) uygulamasına geçilmiştir."]},
{b:"Öğretmenlik mesleği", m:[
"Öğretmenlik; özel alan bilgisi, pedagojik formasyon ve genel kültür gerektiren bir uzmanlık mesleğidir.",
"7354 sayılı Öğretmenlik Meslek Kanunu (2022) öğretmenlik kariyer basamaklarını öğretmen, uzman öğretmen ve başöğretmen olarak düzenlemiştir.",
"Öğretmen nitelikleri: alan ve pedagojik alan bilgisi, öğrenciyi tanıma, öğrenme ortamı düzenleme, ölçme-değerlendirme, mesleki gelişim ve etik sorumluluk.",
"Beden eğitimi öğretmeni ayrıca güvenli öğrenme ortamı, ilk yardım farkındalığı, kapsayıcı (engelli bireyleri de içeren) etkinlik tasarımı ve sağlıklı yaşam modeli olma sorumluluğu taşır."]}
],
podcast:[
{t:"Eğitim nedir?", d:"Ertürk tanımını parçalarına ayırmak", s:[
["H","Eğitime Giriş dersinin en klasik sorusu: eğitim nedir? Selahattin Ertürk'ün tanımını hatırlayan?"],
["Ö","Bireyin davranışlarında kendi yaşantısı yoluyla kasıtlı olarak istendik değişme meydana getirme süreci."],
["H","Mükemmel. Şimdi parçalayalım. Kendi yaşantısı yoluyla: yani öğrenci bizzat yaşamalı, ona dışarıdan yapıştıramayız. Kasıtlı: planlı ve amaçlı. İstendik: toplumun ve bireyin değerli bulduğu yönde. Süreç: bir anlık değil, devam eden bir şey."],
["Ö","Peki kasıtsız öğrenmeler eğitim değil mi?"],
["H","Bu tanıma göre kasıtsız öğrenmeler informal eğitim olarak ayrı değerlendirilir. Mesela çocuk sokakta küfür öğreniyorsa bu bir öğrenmedir ama istendik değildir."],
["Ö","Öğrenme, öğretme ve öğretim de karışıyor."],
["H","Öğrenme, yaşantı ürünü kalıcı davranış değişikliğidir. Öğretme, öğrenmeye rehberlik etmektir. Öğretim ise bu rehberliğin okulda planlı ve kontrollü yapılmasıdır. Her öğretim bir öğretmedir ama her öğretme öğretim değildir."],
["Ö","Örtük program da sınavlarda çıkıyor."],
["H","Evet. Resmî programda yazmayan ama okulda öğrenilen her şeydir. Beden eğitimi öğretmeni hep geç gelir, maçta hakeme bağırırsa öğrenciler bunu da öğrenir. Sizin davranışlarınız, en güçlü örtük programdır."]]},
{t:"Felsefe sınıfa girince", d:"Eğitim felsefeleri ve beden eğitimi", s:[
["H","Bugün eğitim felsefelerini bir beden eğitimi dersi üzerinden düşüneceğiz."],
["Ö","Hocam, esasici bir beden eğitimi öğretmeni nasıl olur?"],
["H","Temel becerileri ve kuralları sistemli öğretir, öğretmen merkezlidir, disiplin ve standartlar önemlidir. Komut stiliyle çalışmayı sever."],
["Ö","İlerlemeci olan ise öğrenciyi merkeze alır."],
["H","Evet, John Dewey'in izinden gider. Öğrenciler bir oyunun kurallarını kendileri tasarlar, problem çözerek, yaparak yaşayarak öğrenirler. İlerlemecilik pragmatizme dayanır; bilgi değişir, işe yarayan doğrudur."],
["Ö","Daimicilik de değişmeyen doğrular."],
["H","Doğru, klasik eserler, akıl eğitimi, evrensel değerler. Beden eğitiminde Olimpizmin evrensel değerlerini vurgulayan bir yaklaşımı düşünebilirsiniz. Yeniden kurmacılık ise okulu toplumu dönüştürmenin aracı görür; Theodore Brameld ile anılır. Mesela kız çocuklarının spora katılımını artırmaya yönelik bir okul projesi bu bakışa uygundur."],
["Ö","Varoluşçuluk da bireysel seçim."],
["H","Evet. Öğrenciye hangi sporu seçeceği, kendi hedefini nasıl koyacağı konusunda özgürlük ve sorumluluk verir. Gerçekte hiçbir öğretmen tek bir felsefeye sığmaz; önemli olan kendi felsefenizin farkında olmanız."]]},
{t:"Yasalar ve ilkeler", d:"Türk millî eğitim sistemi", s:[
["H","Bu bölümde Türk eğitim sisteminin yasal çerçevesini konuşacağız. Temel kanunumuz hangisi?"],
["Ö","1739 sayılı Millî Eğitim Temel Kanunu, 1973."],
["H","Doğru. Genel amaçları ve temel ilkeleri bu kanun belirler. Genellik ve eşitlik, fırsat ve imkân eşitliği, yöneltme, süreklilik, laiklik, bilimsellik, karma eğitim gibi."],
["Ö","Yöneltme ilkesini biraz açar mısınız?"],
["H","Öğrencilerin ilgi, yetenek ve kabiliyetleri doğrultusunda programlara ya da okullara yöneltilmesidir. Bir beden eğitimi öğretmeni olarak yetenekli bir öğrenciyi spor lisesine yönlendirmeniz bunun bir örneğidir."],
["Ö","Tevhid-i Tedrisat ne zaman çıktı?"],
["H","3 Mart 1924. Tüm eğitim kurumlarını tek çatı altında, Maarif Vekâletine bağladı. 2012'deki 6287 sayılı Kanun ile de 12 yıllık zorunlu eğitime, yani 4+4+4 sistemine geçildi."],
["Ö","Öğretmenlik Meslek Kanunu da yeni sayılır."],
["H","Evet, 2022 tarihli 7354 sayılı kanun. Kariyer basamaklarını öğretmen, uzman öğretmen ve başöğretmen olarak düzenledi. Sizin meslek yaşamınızı doğrudan etkileyen bir kanun, mutlaka okuyun."]]}
],
sc:[
["Ertürk'ün eğitim tanımındaki “kasıtlı” ve “istendik” kavramları aynı şey mi?","Hayır. Kasıtlı, sürecin planlı ve amaçlı olmasıdır. İstendik ise ulaşılan değişikliğin toplum ve birey açısından olumlu, değerli görülmesidir. Kasıtlı olup istenmedik sonuç doğuran durumlar da olabilir."],
["Örgün ve yaygın eğitim nasıl ayırt edilir?","Örgün eğitim belirli yaş grubuna, okul içinde, belirli bir programla ve diploma/kademe sistemiyle verilir. Yaygın eğitim ise örgün eğitim yanında ya da dışında, her yaştan bireye kurs, seminer ve halk eğitim merkezleri gibi esnek yapılarla verilir."],
["Örtük program beden eğitimi dersinde neye benzer?","Programda yazmayan ama öğrencilerin öğrendiği her şeydir: öğretmenin kaybetmeye tepkisi, erkek ve kız öğrencilere farklı davranması, sürekli aynı öğrencilerin takım kaptanı seçilmesi gibi. Bunlar güçlü mesajlar taşır."],
["İlerlemecilik ile yeniden kurmacılık arasındaki fark nedir?","İlerlemecilik öğrenciyi merkeze alır ve toplumsal değişime uyum sağlayan bireyler yetiştirmeyi hedefler. Yeniden kurmacılık bir adım ileri gider; okulu toplumu değiştirme ve yeniden yapılandırma aracı olarak görür."],
["Fırsat ve imkân eşitliği ilkesini derste nasıl uygularım?","Tüm öğrencilerin, cinsiyet, engel durumu veya beceri düzeyi fark etmeksizin etkinliklere katılabileceği uyarlamalar yaparak: farklı top boyutları, farklı mesafeler, eleme olmayan oyunlar, engelli öğrenciler için uyarlanmış görevler."],
["Daimicilik ve esasicilik neden karıştırılır?","İkisi de geleneksel, öğretmen merkezli ve konu merkezlidir. Fark şudur: Daimicilik değişmeyen evrensel doğrulara ve klasik eserlere odaklanır; esasicilik ise kültürün güncel temel bilgi ve becerilerinin (okuma, yazma, matematik, bilim) aktarılmasına odaklanır."]
],
test:[
["“Bireyin davranışlarında kendi yaşantısı yoluyla kasıtlı olarak istendik değişme meydana getirme süreci” tanımı kime aittir?",["Selahattin Ertürk","John Dewey","Ziya Gökalp","Émile Durkheim","Hasan Ali Yücel"],"Bu tanım Türkiye'de en yaygın kullanılan Ertürk tanımıdır."],
["Öğrenmenin okulda planlı ve kontrollü biçimde gerçekleştirilmesine ne ad verilir?",["Öğretim","Öğretme","Eğitim","Sosyalleşme","Kültürleme"],"Öğretim, öğretmenin okul ortamında planlı ve kontrollü yürütülen biçimidir."],
["Resmî programda yer almadığı hâlde okulda öğrencilerin kazandığı davranışlar hangi programla ilgilidir?",["Örtük program","Dışta bırakılan program","Ders programı","Eğitim programı","Öğretim programı"],"Örtük (gizli) program yazılı olmayan ama öğrenilen öğeleri kapsar."],
["Halk eğitim merkezlerinde düzenlenen kurslar hangi eğitim türüne örnektir?",["Yaygın eğitim","Örgün eğitim","İnformal eğitim","Okul öncesi eğitim","Özel eğitim"],"Yaygın eğitim örgün eğitim dışında her yaştan bireye esnek yapılarla verilir."],
["“Yaparak yaşayarak öğrenme” anlayışı en çok hangi eğitim felsefesiyle ilişkilidir?",["İlerlemecilik","Daimicilik","Esasicilik","İdealizm","Realizm"],"Dewey'in ilerlemeciliği deneyim ve problem çözmeyi merkeze alır."],
["Okulu toplumu değiştirme ve yeniden yapılandırma aracı olarak gören eğitim felsefesi hangisidir?",["Yeniden kurmacılık","Daimicilik","Esasicilik","Varoluşçuluk","İdealizm"],"Yeniden kurmacılık Theodore Brameld ile anılır."],
["Değişmeyen evrensel doğruları ve klasik eserleri öne çıkaran eğitim felsefesi hangisidir?",["Daimicilik","İlerlemecilik","Yeniden kurmacılık","Varoluşçuluk","Pragmatizm"],"Daimicilik (perennializm) idealizm ve realizme dayanır."],
["İlerlemecilik eğitim felsefesi hangi felsefi akıma dayanır?",["Pragmatizm","İdealizm","Realizm","Skolastisizm","Rasyonalizm"],"Pragmatizm bilginin değişken ve işe yararlığıyla ölçülen bir şey olduğunu savunur."],
["Türk millî eğitiminin genel amaç ve temel ilkelerini belirleyen kanun hangisidir?",["1739 sayılı Millî Eğitim Temel Kanunu","6287 sayılı Kanun","7354 sayılı Öğretmenlik Meslek Kanunu","430 sayılı Tevhid-i Tedrisat Kanunu","2547 sayılı Yükseköğretim Kanunu"],"1739 sayılı kanun 1973'te yürürlüğe girmiştir."],
["Tevhid-i Tedrisat Kanunu hangi tarihte kabul edilmiştir?",["3 Mart 1924","29 Ekim 1923","1 Kasım 1928","23 Nisan 1920","24 Temmuz 1923"],"Tevhid-i Tedrisat 3 Mart 1924'te kabul edilmiştir."],
["12 yıllık zorunlu eğitime (4+4+4) geçişi sağlayan kanun numarası hangisidir?",["6287","1739","7354","2547","222"],"6287 sayılı Kanun 2012'de kabul edilmiştir."],
["7354 sayılı Öğretmenlik Meslek Kanunu'na göre öğretmenlik kariyer basamakları hangileridir?",["Öğretmen, uzman öğretmen, başöğretmen","Aday öğretmen, öğretmen, müdür","Stajyer, öğretmen, eğitim uzmanı","Öğretmen, şef öğretmen, baş müfettiş","Sözleşmeli, kadrolu, uzman"],"Kanun kariyer basamaklarını öğretmen, uzman öğretmen ve başöğretmen olarak düzenler."],
["Öğrencilerin ilgi ve yetenekleri doğrultusunda programlara ve okullara yönlendirilmesi hangi temel ilkeyle ilgilidir?",["Yöneltme","Süreklilik","Laiklik","Planlılık","Karma eğitim"],"Yöneltme ilkesi bireysel ilgi ve yeteneklere göre yönlendirmeyi öngörür."],
["Aşağıdakilerden hangisi eğitimin felsefi temelinin cevap aradığı sorudur?",["Nasıl bir insan yetiştirmeliyiz?","Öğrenme beyinde nasıl gerçekleşir?","Eğitime ne kadar bütçe ayrılmalı?","Okul kaç derslikli olmalı?","Ders saatleri kaç dakika olmalı?"],"Felsefi temel eğitimin amaç ve değerlerini belirler."],
["Kasıtsız ve plansız gerçekleşen, örneğin akran ve medya yoluyla oluşan öğrenmeler hangi kavramla ifade edilir?",["İnformal eğitim","Formal eğitim","Örgün eğitim","Yaygın eğitim","Hizmet içi eğitim"],"İnformal eğitim kasıtsız ve gelişigüzeldir."]
]
},
{
id:"sos", kisa:"Eğitim Sosyolojisi", ad:"Eğitim Sosyolojisi", renk:"#b7791f",
konular:[
{b:"Sosyoloji ve eğitim sosyolojisi", m:[
"Sosyoloji, toplumsal ilişkileri, grupları, kurumları ve toplumsal değişmeyi bilimsel yöntemlerle inceleyen bilimdir; “sosyoloji” terimini Auguste Comte kullanmıştır.",
"İbn Haldun, Mukaddime adlı eseriyle toplumsal olayları sistemli inceleyen öncü düşünürlerdendir.",
"Émile Durkheim eğitim sosyolojisinin kurucusu kabul edilir; eğitimi yetişkin kuşağın genç kuşak üzerindeki sistemli etkisi, yani metodik sosyalleşme olarak tanımlar.",
"Türkiye'de Ziya Gökalp sosyolojinin öncüsüdür; 1914'te Darülfünun'da ilk sosyoloji kürsüsü kurulmuştur.",
"Eğitim sosyolojisi; okul, aile, kültür, toplumsal tabakalaşma ve değişme ile eğitim arasındaki ilişkileri inceler."]},
{b:"Kuramsal yaklaşımlar", m:[
"İşlevselci (yapısal-işlevselci) yaklaşım: Durkheim, Parsons. Eğitim toplumsal bütünleşmeyi, kültür aktarımını ve rol dağılımını (seçme-yerleştirme) sağlar.",
"Çatışmacı yaklaşım: Marx kökenli; Bowles ve Gintis'e göre okul, kapitalist üretim ilişkilerini yeniden üretir (uygunluk/yazışma ilkesi).",
"Pierre Bourdieu: Kültürel sermaye ve habitus kavramlarıyla okulun toplumsal eşitsizlikleri yeniden ürettiğini savunur.",
"Sembolik etkileşimci yaklaşım: G. H. Mead; sınıf içi etkileşim, etiketleme ve beklentiler. Rosenthal ve Jacobson'ın çalışması öğretmen beklentisinin öğrenci başarısını etkilediğini gösterir (Pygmalion etkisi / kendini gerçekleştiren kehanet)."]},
{b:"Sosyalleşme ve kültür", m:[
"Sosyalleşme, bireyin toplumun değer, norm ve rollerini öğrenerek toplumun üyesi olma sürecidir; aile, okul, akran grubu ve medya başlıca sosyalleşme araçlarıdır.",
"Kültür, bir topluluğun maddi (araç-gereç, yapı) ve manevi (değer, inanç, dil, gelenek) unsurlarının bütünüdür.",
"Kültürlenme: Bireyin kendi kültürünü öğrenmesi. Kültürleşme: Farklı kültürlerin etkileşim sonucu birbirinden öğe alması. Kültürel yayılma: Kültür öğelerinin bir toplumdan diğerine geçmesi.",
"Kültürel gecikme (Ogburn): Maddi kültürün manevi kültüre göre daha hızlı değişmesiyle ortaya çıkan uyumsuzluk.",
"Kültür şoku: Bireyin farklı bir kültürle karşılaştığında yaşadığı uyum güçlüğü ve şaşkınlık."]},
{b:"Toplumsal yapı, tabakalaşma ve hareketlilik", m:[
"Toplumsal kurumlar: aile, eğitim, din, ekonomi ve siyaset; temel toplumsal ihtiyaçları karşılayan kalıcı yapılardır.",
"Statü, bireyin toplumdaki konumudur: verilmiş (doğuştan, ör. cinsiyet) ve kazanılmış (çabayla, ör. öğretmenlik). Rol, o statüden beklenen davranışlardır.",
"Toplumsal tabakalaşma: Toplumun gelir, servet, güç ve prestije göre katmanlara ayrılması.",
"Toplumsal hareketlilik: Dikey (yukarı/aşağı) ve yatay (aynı düzeyde) hareketlilik; kuşaklar arası ve kuşak içi hareketlilik. Eğitim dikey hareketliliğin en önemli araçlarından biridir."]},
{b:"Okul, toplum ve spor", m:[
"Okul bir sosyal sistemdir; kendine özgü kültürü (okul kültürü), normları, rolleri ve iletişim ağları vardır.",
"Öğretmen; sınıfta rehber, model, lider ve toplumla okul arasında köprü rollerini üstlenir.",
"Spor güçlü bir sosyalleşme aracıdır: kural, iş birliği, rekabet ve aidiyet duygusu kazandırır; ancak şiddet, fanatizm ve dışlama gibi işlev bozuklukları da gösterebilir.",
"Spora katılımda cinsiyet, sosyoekonomik düzey, engellilik ve kentsel-kırsal farklılıklar eşitsizlik yaratabilir; okul beden eğitimi bu eşitsizlikleri azaltmada kritik role sahiptir."]}
],
podcast:[
{t:"Durkheim'dan Bourdieu'ya", d:"Eğitim sosyolojisinin büyük kuramları", s:[
["H","Bugün eğitim sosyolojisinin büyük kuramlarını bir saha üzerinde düşüneceğiz. Okul bir futbol sahası olsun."],
["Ö","İşlevselci bakış bu sahayı nasıl görür hocam?"],
["H","Durkheim ve Parsons'a göre saha düzenli bir sistemdir. Herkesin bir mevkisi, bir rolü vardır. Okul ortak değerleri aktarır, toplumu bir arada tutar ve bireyleri yeteneklerine göre farklı rollere yerleştirir."],
["Ö","Çatışmacılar da bu sahanın eğimli olduğunu söylüyor."],
["H","Çok güzel bir benzetme. Marx kökenli çatışmacı yaklaşıma göre saha eşit değildir. Bowles ve Gintis okulun, iş dünyasındaki hiyerarşiyi yeniden ürettiğini söyler; buna uygunluk ilkesi denir."],
["Ö","Bourdieu nereye oturuyor?"],
["H","Bourdieu kültürel sermaye kavramını getirir. Bazı çocuklar sahaya krampon, antrenman geçmişi ve oyunu bilen bir aileyle gelir. Okul bu sermayeyi ödüllendirir, böylece eşitsizlik yeniden üretilir."],
["Ö","Sembolik etkileşimciler ise sahadaki konuşmalara bakıyor."],
["H","Evet, mikro düzeyde. Öğretmen bir öğrenciye sürekli beceriksiz derse, öğrenci bu etiketi içselleştirebilir. Rosenthal ve Jacobson'ın çalışması öğretmen beklentisinin başarıyı etkilediğini gösterdi; buna Pygmalion etkisi diyoruz. Öğretmen olarak sözlerinizin gücünü unutmayın."]]},
{t:"Kültür değişirken", d:"Kültürlenme, kültürleşme, kültürel gecikme", s:[
["H","Kültür kavramlarını en çok karıştırılan üçlüyle başlatalım: kültürlenme, kültürleşme, kültürel yayılma."],
["Ö","Kültürlenme kendi kültürünü öğrenmek, değil mi?"],
["H","Evet. Bir çocuğun bayramda büyüklerinin elini öpmeyi öğrenmesi kültürlenmedir. Kültürleşme ise iki farklı kültürün etkileşime girip birbirinden öğe almasıdır."],
["Ö","Kültürel gecikme de Ogburn'du."],
["H","Doğru. Maddi kültür, yani teknoloji, manevi kültürden, yani değerlerden ve normlardan daha hızlı değişir. Örneğin akıllı telefonlar hızla yayıldı ama dijital etik ve mahremiyet normları geriden geliyor."],
["Ö","Kültür şoku da başka bir ülkeye gidince yaşanıyor."],
["H","Ya da başka bir ortama. Kırsaldan büyük şehre gelen bir öğrenci üniversitede kültür şoku yaşayabilir. Öğretmenler bunun farkında olmalı."],
["Ö","Spor kültürle nasıl ilişkili?"],
["H","Spor bir kültür ögesidir ve kültürel yayılmanın güzel bir örneğidir. Futbol İngiltere'den tüm dünyaya yayıldı, güreş ise bizim kültürümüzün derin bir parçası. Beden eğitimi dersleri, kültürü aktaran en canlı alanlardan biridir."]]},
{t:"Merdiven ve okul", d:"Toplumsal hareketlilik ve eşitsizlik", s:[
["H","Toplumsal hareketliliği bir merdiven gibi düşünelim. Merdivende yukarı ya da aşağı inmek?"],
["Ö","Dikey hareketlilik hocam."],
["H","Evet. Aynı basamakta sağa sola geçmek ise yatay hareketliliktir; örneğin bir öğretmenin başka bir okulda aynı görevde çalışmaya başlaması."],
["Ö","Kuşaklar arası hareketlilik de anne baba ile çocuk arasındaki fark."],
["H","Doğru. Babası tarım işçisi olan bir çocuğun öğretmen olması kuşaklar arası dikey yukarı hareketliliktir. Bir kişinin kendi yaşamı içinde değişen konumu ise kuşak içi hareketliliktir."],
["Ö","Eğitim burada nasıl bir rol oynuyor?"],
["H","Eğitim dikey hareketliliğin en önemli araçlarından biridir. Ama çatışmacı kuramcılar bize şunu hatırlatır: Okula herkes aynı sermayeyle gelmez. Bu yüzden fırsat eşitliği sadece aynı okula gitmek değildir."],
["Ö","Spor da bir hareketlilik kanalı olabilir mi?"],
["H","Olabilir; bazı sporcular dar gelirli ailelerden gelip yüksek statü kazanır. Ama bu yol çok dar bir kapıdır. Asıl güçlü kanal eğitimdir. Sporu öğrencileriniz için okuldan kopmanın değil, okula bağlanmanın aracı yapın."]]}
],
sc:[
["Durkheim eğitimi nasıl tanımlar?","Durkheim'a göre eğitim, yetişkin kuşakların toplumsal yaşama henüz hazır olmayan genç kuşaklar üzerindeki sistemli etkisidir. Buna metodik sosyalleşme denir; amaç toplumun ortak değerlerini aktarmak ve toplumsal bütünleşmeyi sağlamaktır."],
["Kültürel sermaye ile ekonomik sermaye arasındaki fark nedir?","Ekonomik sermaye para ve mülkiyettir. Kültürel sermaye ise dil kullanımı, bilgi, beğeniler, eğitim belgeleri ve kültürel alışkanlıklardır. Bourdieu'ya göre okul, üst sınıfların kültürel sermayesini “doğal yetenek” gibi ödüllendirerek eşitsizliği yeniden üretir."],
["Pygmalion etkisini beden eğitimi dersinde nasıl görürüm?","Öğretmen bazı öğrencileri “yetenekli” görüp onlara daha çok fırsat, geri bildirim ve cesaret verirse bu öğrenciler gerçekten daha çok gelişir. “Beceriksiz” görülenler ise geri planda kalır. Herkese yüksek ve olumlu beklentiyle yaklaşmak bu döngüyü kırar."],
["Kültürleşme ile kültürlenme nasıl ayırt edilir?","Kültürlenme bireyin kendi kültürünü öğrenmesidir (dikey aktarım, kuşaktan kuşağa). Kültürleşme ise farklı kültürlerin karşılaşması sonucu karşılıklı öğe alışverişidir (yatay etkileşim)."],
["Verilmiş ve kazanılmış statü örnekleri neler?","Verilmiş statü doğuştan gelir ve kişinin seçimine bağlı değildir: cinsiyet, yaş, kardeş sırası. Kazanılmış statü kişinin çabasıyla elde edilir: öğretmenlik, milli sporculuk, takım kaptanlığı."],
["Sporun toplumsal işlev bozuklukları nelerdir?","Şiddet ve holiganizm, fanatizm, doping, aşırı ticarileşme, cinsiyet ve engellilik temelli dışlama ve başarı baskısı. Eğitimci olarak sporun olumlu işlevlerini güçlendirip bu sorunları önlemek gerekir."]
],
test:[
["Eğitim sosyolojisinin kurucusu olarak kabul edilen ve eğitimi “metodik sosyalleşme” olarak tanımlayan sosyolog kimdir?",["Émile Durkheim","Max Weber","Karl Marx","Auguste Comte","George Herbert Mead"],"Durkheim eğitimi yetişkin kuşağın genç kuşak üzerindeki sistemli etkisi olarak görür."],
["“Sosyoloji” terimini ilk kullanan düşünür kimdir?",["Auguste Comte","İbn Haldun","Émile Durkheim","Herbert Spencer","Ziya Gökalp"],"Comte, toplumu inceleyen bilim için bu terimi kullanmıştır."],
["Türkiye'de ilk sosyoloji kürsüsü kimin öncülüğünde, hangi yıl kurulmuştur?",["Ziya Gökalp – 1914","Prens Sabahattin – 1908","Hilmi Ziya Ülken – 1933","Mümtaz Turhan – 1945","Nurettin Topçu – 1924"],"Ziya Gökalp 1914'te Darülfünun'da ilk sosyoloji kürsüsüne getirilmiştir."],
["Okulun toplumsal bütünleşmeyi ve kültür aktarımını sağladığını vurgulayan yaklaşım hangisidir?",["İşlevselci yaklaşım","Çatışmacı yaklaşım","Sembolik etkileşimci yaklaşım","Postmodern yaklaşım","Fenomenolojik yaklaşım"],"İşlevselcilik toplumun düzen ve uyumuna odaklanır."],
["Okulun kapitalist üretim ilişkilerini yeniden ürettiğini “uygunluk ilkesi” ile açıklayanlar kimlerdir?",["Bowles ve Gintis","Rosenthal ve Jacobson","Parsons ve Merton","Mead ve Cooley","Berger ve Luckmann"],"Bowles ve Gintis çatışmacı yaklaşımın önemli temsilcileridir."],
["“Kültürel sermaye” ve “habitus” kavramlarıyla tanınan sosyolog kimdir?",["Pierre Bourdieu","Émile Durkheim","Talcott Parsons","Max Weber","William Ogburn"],"Bourdieu okulun eşitsizlikleri yeniden ürettiğini bu kavramlarla açıklar."],
["Öğretmen beklentisinin öğrenci başarısını etkilediğini gösteren etki hangisidir?",["Pygmalion etkisi","Hawthorne etkisi","Halo etkisi","Kültürel gecikme","Kültür şoku"],"Rosenthal ve Jacobson'ın çalışmasıyla tanınır; kendini gerçekleştiren kehanet olarak da bilinir."],
["Maddi kültürün manevi kültüre göre daha hızlı değişmesiyle oluşan uyumsuzluğa ne ad verilir?",["Kültürel gecikme","Kültür şoku","Kültürleşme","Kültürel yayılma","Kültürlenme"],"Kavram William Ogburn'a aittir."],
["Bireyin doğduğu toplumun kültürünü öğrenmesi sürecine ne ad verilir?",["Kültürlenme","Kültürleşme","Kültürel yayılma","Asimilasyon","Kültür şoku"],"Kültürlenme kendi kültürünü öğrenmektir; kültürleşme farklı kültürler arası etkileşimdir."],
["Babası mevsimlik tarım işçisi olan bir kişinin öğretmen olması hangi hareketlilik türüne örnektir?",["Kuşaklar arası dikey hareketlilik","Kuşak içi yatay hareketlilik","Coğrafi hareketlilik","Kuşaklar arası yatay hareketlilik","Aşağı doğru dikey hareketlilik"],"Kuşaklar arasında yukarı doğru dikey bir statü değişimi vardır."],
["Aşağıdakilerden hangisi kazanılmış statüye örnektir?",["Milli takım kaptanı olmak","Kadın olmak","Ailenin ilk çocuğu olmak","Belirli bir yaşta olmak","Belirli bir etnik kökene sahip olmak"],"Kazanılmış statü bireyin çabasıyla elde edilir."],
["Sınıf içi etkileşim, etiketleme ve anlam üretimi gibi mikro süreçlere odaklanan yaklaşım hangisidir?",["Sembolik etkileşimci yaklaşım","İşlevselci yaklaşım","Çatışmacı yaklaşım","Yapısalcı yaklaşım","Sistem yaklaşımı"],"Sembolik etkileşimcilik G. H. Mead ile ilişkilendirilir."],
["Futbolun İngiltere'den dünyaya yayılması hangi kavrama örnektir?",["Kültürel yayılma","Kültürel gecikme","Kültürlenme","Kültür şoku","Kültürel görecelik"],"Bir kültür ögesinin başka toplumlara geçmesi kültürel yayılmadır."],
["Mukaddime adlı eseriyle toplumsal olayları sistemli inceleyen öncü düşünür kimdir?",["İbn Haldun","Farabi","İbn Sina","Gazali","Biruni"],"İbn Haldun sosyolojinin öncülerinden sayılır."],
["Aşağıdakilerden hangisi sporun toplumsal işlev bozukluklarından biridir?",["Fanatizm ve şiddet","Takım ruhu kazandırma","Kural bilinci geliştirme","Aidiyet duygusu oluşturma","Sağlıklı yaşamı teşvik etme"],"Fanatizm ve şiddet sporun olumsuz (işlev bozucu) yönlerindendir."]
]
}
];

</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="beso-ders-cebi-v1";
let S={r:{},mine:[],seen:{}};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v)S=Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)};
const LET="ABCDE";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const C=id=>COURSES.find(c=>c.id===id);
const prog=c=>{const n=c.test.length;let ok=0,done=0;c.test.forEach((_,i)=>{const v=S.r[c.id+":"+i];if(v!==undefined){done++;if(v)ok++}});return{n,ok,done,p:Math.round(ok/n*100)}};
const app=$("#app");
let view={name:"home"};let quiz=null;let timer=null;

function nav(name,extra){stopSpeech();clearInterval(timer);view=Object.assign({name},extra||{});render();window.scrollTo(0,0)}
document.querySelectorAll("nav.bot button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.go)));

function header(title,sub,back){return `<header class="top"><div class="row">${back?'<button class="back" data-act="back" aria-label="Geri">‹</button>':''}<div><small>${esc(sub)}</small><h1>${esc(title)}</h1></div></div></header>`}

function render(){
  document.querySelectorAll("nav.bot button").forEach(b=>b.classList.toggle("on",b.dataset.go===view.name||(view.name==="course"&&b.dataset.go==="home")));
  const f={home,course,quizView,exam,wrong,mine,search}[view.name];app.innerHTML=f();bind();
}

function home(){
  const all=COURSES.map(prog);const tot=all.reduce((a,b)=>a+b.n,0),ok=all.reduce((a,b)=>a+b.ok,0),done=all.reduce((a,b)=>a+b.done,0);
  const day=Math.floor(Date.now()/864e5);const pool=COURSES.flatMap(c=>c.test.map((t,i)=>({c,i,t})));const dq=pool[day%pool.length];
  return header("Ders Cebi","MÜ · BESÖ · 1. sınıf")+`<div class="wrap">
  <div class="track" role="list" aria-label="Dersler ve ilerleme">${COURSES.map((c,i)=>{const p=prog(c);return `<button class="lane" role="listitem" data-open="${c.id}"><span class="no">${i+1}</span><span class="run"><span class="nm">${esc(c.ad)}</span><span class="pc">%${p.p}</span><span class="bar"><i style="width:${p.p}%"></i></span><span class="dot" style="left:calc(8px + (100% - 34px) * ${p.p/100})"></span></span></button>`}).join("")}<span class="finish"></span></div>
  <p class="muted">Koşucular her dersin testinde doğru cevapladığın soru oranına göre ilerler. Kulvara dokunarak derse gir.</p>
  <div class="stats"><div class="stat"><b>${done}/${tot}</b><span>çözülen soru</span></div><div class="stat"><b>%${done?Math.round(ok/done*100):0}</b><span>başarı</span></div><div class="stat"><b>${Object.values(S.r).filter(v=>v===0).length}</b><span>tekrar edilecek</span></div></div>
  <input type="search" id="q" placeholder="Konu, kavram veya soru ara (ör. kaldıraç, Dewey)" aria-label="Ara">
  <div class="sec"><h2>Günün sorusu</h2><button class="card" data-daily="${dq.c.id}:${dq.i}"><span class="chip">${esc(dq.c.kisa)}</span><p class="q" style="margin:10px 0 4px">${esc(dq.t[0])}</p><span class="muted">Cevaplamak için dokun</span></button></div>
  <div class="sec"><h2>Hızlı başla</h2><div class="btns"><button class="btn" data-go2="exam">25 soruluk deneme sınavı</button><button class="btn alt" data-go2="wrong">Yanlışlarımı tekrar et</button></div></div>
  <p class="muted">İçerik derslerin genel müfredatına göre hazırlanmış çalışma materyalidir; hocanızın ders notları ve kaynakları esastır. Uygulama internet olmadan çalışır; ilerlemen bu cihazda saklanır.</p></div>`;
}

function course(){
  const c=C(view.id),tab=view.tab||"konu";const p=prog(c);
  const T=[["konu","Konular"],["pod","Podcast"],["sc","Soru-Cevap"],["test","Test"]];
  let body="";
  if(tab==="konu")body=c.konular.map((k,i)=>`<div class="card topic"><span class="chip">Konu ${i+1}</span><h3 style="margin-top:8px">${esc(k.b)}</h3><ul>${k.m.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`).join("");
  if(tab==="pod"){const ep=view.ep;body=(ep!==undefined?playerHTML(c,ep):`<p class="muted">Bölümler hoca ve öğrenci arasında geçen sohbet biçimindedir. Cihazının Türkçe sesiyle okunur; internet gerekmez. Metne dokunarak istediğin yerden başlatabilirsin.</p>`)+c.podcast.map((e,i)=>`<div class="card ep"><button class="play" data-ep="${i}" aria-label="${esc(e.t)} bölümünü oynat">▶</button><div><span class="chip">Bölüm ${i+1} · ~${Math.max(2,Math.round(e.s.reduce((a,l)=>a+l[1].split(" ").length,0)/130))} dk</span><h3 style="margin-top:6px">${esc(e.t)}</h3><span class="muted">${esc(e.d)}</span></div></div>`).join("")}
  if(tab==="sc")body=`<p class="muted">Öğrencilerin sık sorduğu sorular ve hocanın cevapları. Kendi sorunu “Sorularım” bölümüne not edip derste sorabilirsin.</p>`+c.sc.map(q=>`<details class="qa"><summary><span class="av">Ö</span><span>${esc(q[0])}</span></summary><div class="ans"><span class="av h">H</span><div>${esc(q[1])}</div></div></details>`).join("")+`<button class="btn alt" data-go2="mine" data-cid="${c.id}">Hocaya soracağım soruyu not al</button>`;
  if(tab==="test"){const w=c.test.filter((_,i)=>S.r[c.id+":"+i]===0).length;body=`<div class="card"><h3>${c.test.length} soru · 5 şık</h3><p>Her cevaptan sonra doğru şık ve açıklama gösterilir. Şıkların sırası her denemede karışır.</p><p class="muted">Şu ana kadar ${p.done} soru çözdün, ${p.ok} doğru.</p><div class="btns"><button class="btn" data-start="all">Testi başlat</button>${w?`<button class="btn alt" data-start="wrong">Sadece yanlışlarım (${w})</button>`:""}</div></div>`}
  return header(c.ad,`Ders · %${p.p} tamamlandı`,true)+`<div class="tabs" role="tablist">${T.map(t=>`<button role="tab" aria-selected="${t[0]===tab}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div><div class="wrap">${body}</div>`;
}

/* ---------- Podcast (Web Speech, çevrimdışı) ---------- */
const synth=window.speechSynthesis;let sp={c:null,ep:null,i:0,on:false,rate:1};let voices=[];
const loadV=()=>{try{voices=synth.getVoices().filter(v=>/^tr/i.test(v.lang))}catch(e){}};
if(synth){loadV();synth.onvoiceschanged=()=>{loadV();if(view.name==="course"&&view.tab==="pod")render()}}
function playerHTML(c,ep){const e=c.podcast[ep];const n=e.s.length;
  const warn=!synth?"Bu tarayıcı sesli okumayı desteklemiyor; metni okuyarak takip edebilirsin.":(!voices.length?"Cihazında Türkçe ses bulunamadı. Ayarlar › Metin okuma bölümünden Türkçe ses paketini indirirsen podcastler sesli çalar.":"");
  return `<div class="player"><span class="cond" style="font-size:22px">${esc(e.t)}</span>${warn?`<p style="margin:6px 0 0;font-size:14px">${esc(warn)}</p>`:""}<div class="prog"><i id="pp" style="width:${sp.i/n*100}%"></i></div><div class="ctl"><button data-pc="prev" aria-label="Önceki">⏮</button><button data-pc="toggle" id="pt" style="min-width:96px">${sp.on?"Duraklat":"Oynat"}</button><button data-pc="next" aria-label="Sonraki">⏭</button><button data-pc="rate" id="pr">${sp.rate}×</button><button data-pc="close">Kapat</button></div></div>
  <div id="lines">${e.s.map((l,i)=>`<div class="line${i===sp.i?" on":""}" data-line="${i}"><span class="av ${l[0]==="H"?"h":""}">${l[0]}</span><div><b>${l[0]==="H"?"Hoca":"Öğrenci"}:</b> ${esc(l[1])}</div></div>`).join("")}</div>`}
function stopSpeech(){sp.on=false;try{synth&&synth.cancel()}catch(e){}}
function speakFrom(i){const e=sp.c.podcast[sp.ep];if(i>=e.s.length){sp.on=false;sp.i=0;uiSp();toast("Bölüm bitti");return}
  sp.i=i;if(!synth||!voices.length){sp.on=false;uiSp();return}sp.on=true;uiSp();
  try{synth.cancel();const l=e.s[i];const u=new SpeechSynthesisUtterance(l[1]);u.lang="tr-TR";u.rate=sp.rate;
  const v=l[0]==="H"?voices[0]:(voices[1]||voices[0]);u.voice=v;u.pitch=(l[0]==="Ö"&&!voices[1])?1.3:(l[0]==="H"?0.9:1);
  u.onend=()=>{if(sp.on&&sp.i===i)speakFrom(i+1)};synth.speak(u)}catch(err){}}
function uiSp(){const pt=$("#pt");if(!pt)return;pt.textContent=sp.on?"Duraklat":"Oynat";const n=sp.c.podcast[sp.ep].s.length;$("#pp").style.width=(sp.i/n*100)+"%";$("#pr").textContent=sp.rate+"×";
  document.querySelectorAll(".line").forEach((el,k)=>{el.classList.toggle("on",k===sp.i)});const cur=document.querySelector(".line.on");if(cur)cur.scrollIntoView({block:"center",behavior:"smooth"})}

/* ---------- Test motoru ---------- */
function makeQ(cid,i){const t=C(cid).test[i];const o=shuffle(t[1].map((x,k)=>({x,k})));return{cid,i,q:t[0],opts:o.map(z=>z.x),ans:o.findIndex(z=>z.k===0),exp:t[2],pick:null}}
function startQuiz(list,mode,title){quiz={list,pos:0,mode,title,start:Date.now()};nav("quizView")}
function quizView(){const z=quiz;if(!z)return home();
  if(z.pos>=z.list.length)return results();
  const q=z.list[z.pos];const done=q.pick!==null;const instant=z.mode!=="exam";
  const left=z.mode==="exam"?Math.max(0,z.limit-(Date.now()-z.start)):0;
  return header(z.title,z.mode==="exam"?"Deneme sınavı":"Test",true)+`<div class="wrap"><div class="qhead"><span class="chip">${esc(C(q.cid).kisa)}</span><span class="cond" style="font-size:20px">${z.pos+1} / ${z.list.length}${z.mode==="exam"?` · <span id="tm">${fmt(left)}</span>`:""}</span></div><div class="pbar"><i style="width:${z.pos/z.list.length*100}%"></i></div>
  <p class="q">${esc(q.q)}</p>${q.opts.map((o,k)=>{let cl="opt";if(done&&instant){if(k===q.ans)cl+=" ok";else if(k===q.pick)cl+=" no"}else if(q.pick===k)cl+=" sel";return `<button class="${cl}" data-pick="${k}" ${done&&instant?"disabled":""}><span class="l">${LET[k]}</span><span>${esc(o)}</span></button>`}).join("")}
  ${done&&instant?`<div class="fb ${q.pick===q.ans?"":"no"}"><b>${q.pick===q.ans?"Doğru!":"Yanlış. Doğru cevap: "+LET[q.ans]}</b><br>${esc(q.exp)}</div>`:""}
  <div class="btns">${z.mode==="exam"?`${z.pos>0?'<button class="btn alt" data-qnav="-1">Önceki</button>':""}<button class="btn" data-qnav="1">${z.pos===z.list.length-1?"Sınavı bitir":"Sonraki"}</button>`:(done?`<button class="btn" data-qnav="1">${z.pos===z.list.length-1?"Sonuçları gör":"Sonraki soru"}</button>`:"")}</div></div>`}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function finishQuiz(){const z=quiz;z.list.forEach(q=>{if(q.pick!==null)S.r[q.cid+":"+q.i]=q.pick===q.ans?1:0});save();z.pos=z.list.length;clearInterval(timer)}
function results(){const z=quiz;const ok=z.list.filter(q=>q.pick===q.ans).length,n=z.list.length;const wr=z.list.filter(q=>q.pick!==q.ans);
  const by={};z.list.forEach(q=>{by[q.cid]=by[q.cid]||[0,0];by[q.cid][1]++;if(q.pick===q.ans)by[q.cid][0]++});
  return header("Sonuç",z.title,true)+`<div class="wrap"><div class="card" style="text-align:center"><div class="big">${ok}/${n}</div><p>%${Math.round(ok/n*100)} başarı${z.mode==="exam"?` · net ${(ok-(n-ok-z.list.filter(q=>q.pick===null).length)/4).toFixed(2)} (4 yanlış 1 doğruyu götürür)`:""}</p></div>
  ${z.mode==="exam"?Object.entries(by).map(([k,v])=>`<div class="card" style="padding:12px 16px"><div class="qhead"><b>${esc(C(k).ad)}</b><span>${v[0]}/${v[1]}</span></div><div class="pbar"><i style="width:${v[0]/v[1]*100}%"></i></div></div>`).join(""):""}
  ${wr.length?`<div class="sec"><h2>Yanlış ve boş bıraktıkların</h2>${wr.map(q=>`<div class="card"><span class="chip">${esc(C(q.cid).kisa)}</span><p><b>${esc(q.q)}</b></p><p>Senin cevabın: ${q.pick===null?"boş":LET[q.pick]+") "+esc(q.opts[q.pick])}<br>Doğru: <b>${LET[q.ans]}) ${esc(q.opts[q.ans])}</b></p><p class="muted">${esc(q.exp)}</p></div>`).join("")}</div>`:"<p>Hepsi doğru, tebrikler!</p>"}
  <div class="btns"><button class="btn" data-again="1">Tekrar çöz</button><button class="btn alt" data-go2="home">Derslere dön</button></div></div>`}

function exam(){return header("Deneme sınavı","Beş dersten karışık",false)+`<div class="wrap"><div class="card"><h3>Vize/final provası</h3><p>Beş dersten rastgele seçilen sorular, süre tutularak çözülür. Cevaplar sınav sonunda gösterilir; istersen önceki sorulara dönüp cevabını değiştirebilirsin.</p><div class="btns"><button class="btn" data-exam="25">25 soru · 30 dk</button><button class="btn alt" data-exam="50">50 soru · 60 dk</button><button class="btn alt" data-exam="10">10 soru · 12 dk</button></div></div>
  <div class="sec"><h2>Tek ders denemesi</h2>${COURSES.map(c=>`<button class="card" data-cexam="${c.id}"><b>${esc(c.ad)}</b><p class="muted">${c.test.length} soru · ${Math.round(c.test.length*1.2)} dk</p></button>`).join("")}</div></div>`}

function wrong(){const items=Object.entries(S.r).filter(([k,v])=>v===0).map(([k])=>{const[c,i]=k.split(":");return{c,i:+i}}).filter(x=>C(x.c)&&C(x.c).test[x.i]);
  return header("Yanlışlarım","Tekrar listesi",false)+`<div class="wrap">${items.length?`<p>${items.length} soru tekrar bekliyor. Doğru cevapladığında listeden düşer.</p><div class="btns"><button class="btn" data-wrongq="1">Hepsini tekrar çöz</button></div>${items.map(x=>{const t=C(x.c).test[x.i];return `<div class="card"><span class="chip">${esc(C(x.c).kisa)}</span><p><b>${esc(t[0])}</b></p><p>Doğru cevap: ${esc(t[1][0])}</p><p class="muted">${esc(t[2])}</p></div>`}).join("")}`:`<div class="card"><h3>Liste boş</h3><p>Test çözdükçe yanlış yaptığın sorular burada toplanır.</p><div class="btns"><button class="btn" data-go2="exam">Deneme çöz</button></div></div>`}</div>`}

function mine(){const pre=view.cid||"";return header("Sorularım","Hocaya soracaklarım",false)+`<div class="wrap"><div class="card"><label for="mc" class="muted">Ders</label><select id="mc" style="margin:6px 0 10px">${COURSES.map(c=>`<option value="${c.id}" ${c.id===pre?"selected":""}>${esc(c.ad)}</option>`).join("")}</select>
  <label for="mt" class="muted">Sorun</label><textarea id="mt" style="margin-top:6px" placeholder="Ör. Eksantrik kasılmada kas neden daha fazla kuvvet üretebiliyor?"></textarea><div class="btns"><button class="btn" data-addq="1">Kaydet</button></div><p class="muted" style="margin:0">Sorular bu cihazda saklanır. Derste ya da ofis saatinde hocana sorduktan sonra cevabını not alabilirsin.</p></div>
  ${S.mine.length?S.mine.map((m,i)=>`<div class="card"><div class="qhead"><span class="chip">${esc((C(m.c)||{kisa:""}).kisa)}</span><span class="muted">${esc(new Date(m.t).toLocaleDateString("tr-TR"))}</span></div><p><b>${esc(m.q)}</b></p><textarea data-ans="${i}" placeholder="Hocanın cevabını buraya yaz">${esc(m.a||"")}</textarea><div class="btns"><button class="btn alt" data-copy="${i}">Kopyala</button><button class="btn alt" data-del="${i}">Sil</button></div></div>`).join(""):`<p class="muted">Henüz kayıtlı soru yok.</p>`}</div>`}

function search(){const term=(view.t||"").trim();const lo=term.toLocaleLowerCase("tr");const hl=s=>{const e=esc(s);if(!term)return e;const i=s.toLocaleLowerCase("tr").indexOf(lo);if(i<0)return e;return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+term.length))+"</mark>"+esc(s.slice(i+term.length))};
  const res=[];if(lo.length>1)COURSES.forEach(c=>{c.konular.forEach(k=>k.m.forEach(m=>{if(m.toLocaleLowerCase("tr").includes(lo))res.push({c,k:"Konu · "+k.b,s:m,go:{tab:"konu"}})}));c.sc.forEach(q=>{if((q[0]+q[1]).toLocaleLowerCase("tr").includes(lo))res.push({c,k:"Soru-Cevap",s:q[0],go:{tab:"sc"}})});c.podcast.forEach((e,i)=>{if(e.s.some(l=>l[1].toLocaleLowerCase("tr").includes(lo)))res.push({c,k:"Podcast",s:e.t,go:{tab:"pod",ep:i}})});c.test.forEach(t=>{if((t[0]+t[1][0]).toLocaleLowerCase("tr").includes(lo))res.push({c,k:"Test sorusu",s:t[0],go:{tab:"test"}})})});
  search.res=res;
  return header("Arama",res.length+" sonuç",true)+`<div class="wrap"><input type="search" id="q" value="${esc(term)}" aria-label="Ara"><div class="sec">${res.slice(0,60).map((r,i)=>`<button class="card" data-res="${i}"><span class="chip">${esc(r.c.kisa)} · ${esc(r.k)}</span><p>${hl(r.s)}</p></button>`).join("")||'<p class="muted">Sonuç yok. Başka bir kavram dene.</p>'}</div></div>`}

function bind(){
  app.querySelectorAll("[data-act=back]").forEach(b=>b.onclick=()=>{if(view.name==="quizView"&&quiz&&quiz.mode==="exam"&&quiz.pos<quiz.list.length){finishQuiz();render();return}if(view.name==="quizView"&&quiz&&quiz.from)nav("course",quiz.from);else if(view.name==="quizView")nav(quiz&&quiz.mode==="exam"?"exam":"home");else nav("home")});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>nav("course",{id:b.dataset.open,tab:"konu"}));
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>nav(b.dataset.go2,b.dataset.cid?{cid:b.dataset.cid}:{}));
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{stopSpeech();view.tab=b.dataset.tab;delete view.ep;render()});
  app.querySelectorAll("[data-daily]").forEach(b=>b.onclick=()=>{const[c,i]=b.dataset.daily.split(":");startQuiz([makeQ(c,+i)],"test","Günün sorusu")});
  const qi=$("#q");if(qi){qi.addEventListener("keydown",e=>{if(e.key==="Enter"){nav("search",{t:qi.value})}});qi.addEventListener("search",()=>{if(qi.value)nav("search",{t:qi.value})});if(view.name==="search"){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}}
  app.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{const r=search.res[+b.dataset.res];nav("course",Object.assign({id:r.c.id},r.go));if(r.go.ep!==undefined)initEp(r.c,r.go.ep)});
  app.querySelectorAll("[data-ep]").forEach(b=>b.onclick=()=>{const c=C(view.id);stopSpeech();view.ep=+b.dataset.ep;initEp(c,view.ep);render();window.scrollTo(0,0);speakFrom(0)});
  app.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>speakFrom(+b.dataset.line));
  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const a=b.dataset.pc;if(a==="toggle"){if(sp.on){stopSpeech();uiSp()}else speakFrom(sp.i)}if(a==="next")speakFrom(Math.min(sp.i+1,sp.c.podcast[sp.ep].s.length-1));if(a==="prev")speakFrom(Math.max(0,sp.i-1));if(a==="rate"){sp.rate=sp.rate===1?1.25:sp.rate===1.25?1.5:sp.rate===1.5?0.85:1;if(sp.on)speakFrom(sp.i);else uiSp()}if(a==="close"){stopSpeech();delete view.ep;render()}});
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const c=C(view.id);let idx=c.test.map((_,i)=>i);if(b.dataset.start==="wrong")idx=idx.filter(i=>S.r[c.id+":"+i]===0);startQuiz(shuffle(idx).map(i=>makeQ(c.id,i)),"test",c.kisa+" testi");quiz.from={id:c.id,tab:"test"}});
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const q=quiz.list[quiz.pos];if(quiz.mode!=="exam"&&q.pick!==null)return;q.pick=+b.dataset.pick;if(quiz.mode!=="exam"){S.r[q.cid+":"+q.i]=q.pick===q.ans?1:0;save()}render()});
  app.querySelectorAll("[data-qnav]").forEach(b=>b.onclick=()=>{const d=+b.dataset.qnav;if(d>0&&quiz.pos===quiz.list.length-1){if(quiz.mode==="exam")finishQuiz();else quiz.pos++}else quiz.pos=Math.max(0,quiz.pos+d);render();window.scrollTo(0,0)});
  app.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>{const z=quiz;startQuiz(shuffle(z.list.map(q=>makeQ(q.cid,q.i))),z.mode,z.title);quiz.limit=z.limit;quiz.from=z.from;if(z.mode==="exam")runTimer()});
  app.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{const n=+b.dataset.exam;const pool=shuffle(COURSES.flatMap(c=>c.test.map((_,i)=>[c.id,i]))).slice(0,n);startQuiz(pool.map(p=>makeQ(p[0],p[1])),"exam",n+" soruluk deneme");quiz.limit=(n===25?30:n===50?60:12)*60000;runTimer()});
  app.querySelectorAll("[data-cexam]").forEach(b=>b.onclick=()=>{const c=C(b.dataset.cexam);startQuiz(shuffle(c.test.map((_,i)=>makeQ(c.id,i))),"exam",c.kisa+" denemesi");quiz.limit=Math.round(c.test.length*1.2)*60000;runTimer()});
  app.querySelectorAll("[data-wrongq]").forEach(b=>b.onclick=()=>{const it=Object.entries(S.r).filter(([k,v])=>v===0).map(([k])=>k.split(":")).filter(x=>C(x[0])&&C(x[0]).test[+x[1]]);startQuiz(shuffle(it).map(x=>makeQ(x[0],+x[1])),"test","Yanlışlarım")});
  app.querySelectorAll("[data-addq]").forEach(b=>b.onclick=()=>{const t=$("#mt").value.trim();if(!t){toast("Önce sorunu yaz");return}S.mine.unshift({c:$("#mc").value,q:t,a:"",t:Date.now()});save();view.cid=$("#mc").value;render();toast("Soru kaydedildi")});
  app.querySelectorAll("[data-ans]").forEach(t=>t.oninput=()=>{S.mine[+t.dataset.ans].a=t.value;save()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(b.dataset.sure){S.mine.splice(i,1);save();render();toast("Silindi")}else{b.dataset.sure=1;b.textContent="Emin misin? Sil"}});
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const m=S.mine[+b.dataset.copy];const txt=(C(m.c)||{ad:""}).ad+" – "+m.q;try{await navigator.clipboard.writeText(txt);toast("Kopyalandı")}catch(e){toast("Kopyalanamadı")}});
}
function initEp(c,ep){sp.c=c;sp.ep=ep;sp.i=0}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{if(!quiz||view.name!=="quizView"){clearInterval(timer);return}const left=quiz.limit-(Date.now()-quiz.start);const el=$("#tm");if(el)el.textContent=fmt(Math.max(0,left));if(left<=0&&quiz.pos<quiz.list.length){finishQuiz();toast("Süre doldu");render()}},500)}

const onl=()=>{$("#off").style.display=navigator.onLine?"none":"block"};window.addEventListener("online",onl);window.addEventListener("offline",onl);onl();
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
