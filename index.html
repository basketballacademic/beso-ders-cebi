  return header("Arama",res.length+" sonuç",true)+`<div class="wrap"><input type="search" id="q" value="${esc(term)}" aria-label="Ara"><div class="sec">${res.slice(0,60).map((r,i)=>`<button class="card" data-res="${i}"><span class="chip">${esc(r.c.kisa)} · ${esc(r.k)}</span><p>${hl(r.s)}</p></button>`).join("")||'<p class="muted">Sonuç yok. Başka bir kavram dene.</p>'}</div></div>`}

function bind(){
  app.querySelectorAll("[data-act=back]").forEach(b=>b.onclick=()=>{if(view.name==="quizView"&&quiz&&quiz.mode==="exam"&&quiz.pos<quiz.list.length){finishQuiz();render();return}if(view.name==="quizView"&&quiz&&quiz.from)nav("course",quiz.from);else if(view.name==="quizView")nav(quiz&&quiz.mode==="exam"?"exam":"home");else nav("home")});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>nav("course",{id:b.dataset.open,tab:"hafta"}));
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>nav(b.dataset.go2,b.dataset.cid?{cid:b.dataset.cid}:{}));
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(!isAud())stopSpeech();view.tab=b.dataset.tab;delete view.ep;render()});
  app.querySelectorAll("[data-daily]").forEach(b=>b.onclick=()=>{const[c,i]=b.dataset.daily.split(":");startQuiz([makeQ(c,+i)],"test","Günün sorusu")});
  const qi=$("#q");if(qi){qi.addEventListener("keydown",e=>{if(e.key==="Enter"){nav("search",{t:qi.value})}});qi.addEventListener("search",()=>{if(qi.value)nav("search",{t:qi.value})});if(view.name==="search"){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}}
  app.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>{const r=search.res[+b.dataset.res];nav("course",Object.assign({id:r.c.id},r.go))});
  app.querySelectorAll("[data-dl]").forEach(b=>{const ids=b.dataset.dl.split(",");dlState(ids).then(n=>{if(n===ids.length){b.textContent="✓ Sesler çevrimdışı hazır";b.disabled=true}});b.onclick=()=>dlAudio(ids,b)});
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const t=document.getElementById("t"+b.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  app.querySelectorAll("[data-pl]").forEach(b=>b.onclick=e=>{e.stopPropagation();startPl(b.dataset.pl,+(b.dataset.ep||0),+(b.dataset.st||0))});
  app.querySelectorAll(".seek[data-l]").forEach(b=>b.onclick=()=>{const[k,i]=b.dataset.l.split("|");const pr=k.split(":");startPl(pr[0],+(pr[2]||0),+i)});
  app.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const a=b.dataset.pc,n=sp.lines.length;if(a==="toggle"){if(sp.on){stopSpeech();uiSp()}else if(isAud()&&curAid&&au.currentSrc)au.play().catch(()=>{});else speakFrom(sp.i)}if(a==="next")speakFrom(Math.min(sp.i+1,n-1));if(a==="prev")speakFrom(Math.max(0,sp.i-1));if(a==="rate"){sp.rate=sp.rate===1?1.25:sp.rate===1.25?1.5:sp.rate===1.5?0.85:1;if(isAud()){au.playbackRate=sp.rate;uiSp()}else if(sp.on)speakFrom(sp.i);else uiSp()}if(a==="close"){stopSpeech();sp.key=null;sp.map=null;curAid=null;try{au.removeAttribute("src");au.load()}catch(e){}render()}});
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const c=C(view.id);let idx=c.test.map((_,i)=>i);const st=b.dataset.start;if(st==="wrong")idx=idx.filter(i=>S.r[c.id+":"+i]===0);if(st==="bd")idx=idx.filter(i=>c.test[i][3]==="bd");if(st==="mc")idx=idx.filter(i=>c.test[i][3]!=="bd");startQuiz(shuffle(idx).map(i=>makeQ(c.id,i)),"test",c.kisa+(st==="bd"?" · boşluk doldurma":" testi"));quiz.from={id:c.id,tab:"test"}});
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const q=quiz.list[quiz.pos];if(q.pick!==null)return;q.pick=+b.dataset.pick;S.r[q.cid+":"+q.i]=q.pick===q.ans?1:0;save();render()});
  app.querySelectorAll("[data-qnav]").forEach(b=>b.onclick=()=>{stopSpeech();if(quiz.pos===quiz.list.length-1){if(quiz.mode==="exam")finishQuiz();else quiz.pos++}else quiz.pos++;render();window.scrollTo(0,0)});
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{const q=quiz.list[quiz.pos];if(q.pick===null)sayOnce(q.q.replace(/____/g," boşluk ")+". "+q.opts.map((o,k)=>LET[k]+" şıkkı: "+o).join(". "));else sayOnce((q.pick===q.ans?"Doğru. ":"Yanlış. Doğru cevap "+LET[q.ans]+" şıkkı: "+q.opts[q.ans]+". ")+q.exp)});
  app.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>{const z=quiz;startQuiz(shuffle(z.list.map(q=>makeQ(q.cid,q.i))),z.mode,z.title);quiz.limit=z.limit;quiz.from=z.from;if(z.mode==="exam")runTimer()});
  app.querySelectorAll("[data-exam]").forEach(b=>b.onclick=()=>{const bd=b.dataset.exam==="bd20";const n=bd?20:+b.dataset.exam;const pool=shuffle(COURSES.flatMap(c=>c.test.map((t,i)=>[c.id,i,t[3]==="bd"])).filter(p=>!bd||p[2])).slice(0,n);startQuiz(pool.map(p=>makeQ(p[0],p[1])),"exam",bd?"Boşluk doldurma denemesi":n+" soruluk deneme");quiz.limit=(bd?20:n===25?30:n===50?60:12)*60000;runTimer()});
  app.querySelectorAll("[data-cexam]").forEach(b=>b.onclick=()=>{const c=C(b.dataset.cexam);startQuiz(shuffle(c.test.map((_,i)=>makeQ(c.id,i))).slice(0,30),"exam",c.kisa+" denemesi");quiz.limit=36*60000;runTimer()});
  app.querySelectorAll("[data-wrongq]").forEach(b=>b.onclick=()=>{const it=Object.entries(S.r).filter(([k,v])=>v===0).map(([k])=>k.split(":")).filter(x=>C(x[0])&&C(x[0]).test[+x[1]]);startQuiz(shuffle(it).map(x=>makeQ(x[0],+x[1])),"test","Yanlışlarım")});
  app.querySelectorAll("[data-addq]").forEach(b=>b.onclick=()=>{const t=$("#mt").value.trim();if(!t){toast("Önce sorunu yaz");return}S.mine.unshift({c:$("#mc").value,q:t,a:"",t:Date.now()});save();view.cid=$("#mc").value;render();toast("Soru kaydedildi")});
  app.querySelectorAll("[data-ans]").forEach(t=>t.oninput=()=>{S.mine[+t.dataset.ans].a=t.value;save()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(b.dataset.sure){S.mine.splice(i,1);save();render();toast("Silindi")}else{b.dataset.sure=1;b.textContent="Emin misin? Sil"}});
  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const m=S.mine[+b.dataset.copy];const txt=(C(m.c)||{ad:""}).ad+" – "+m.q;try{await navigator.clipboard.writeText(txt);toast("Kopyalandı")}catch(e){toast("Kopyalanamadı")}});
}

function runTimer(){clearInterval(timer);timer=setInterval(()=>{if(!quiz||view.name!=="quizView"){clearInterval(timer);return}const left=quiz.limit-(Date.now()-quiz.start);const el=$("#tm");if(el)el.textContent=fmt(Math.max(0,left));if(left<=0&&quiz.pos<quiz.list.length){finishQuiz();toast("Süre doldu");render()}},500)}

const onl=()=>{$("#off").style.display=navigator.onLine?"none":"block"};window.addEventListener("online",onl);window.addEventListener("offline",onl);onl();
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
